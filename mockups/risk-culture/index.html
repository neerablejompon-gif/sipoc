<title>Risk Culture Tracker 2570</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: glass sidebar 256px + content (max 1240px); ≤900px → bottom nav (mobile "งานของฉัน") */
:root{
  color-scheme:light;
  --brand-600:#0F7A4A; --brand-700:#0B6B41; --brand-800:#0B5C37;
  --brand-50:#E3F4EA;  --brand-25:#E8F6EE;
  --text:#0F2A1F; --text-2:#2E4A3D; --text-muted:#3F5A4D;
  --bg:#F4FAF6;
  --glass-bg:rgba(255,255,255,.64); --glass-border:rgba(255,255,255,.8);
  --glass-blur:blur(18px) saturate(150%);
  --line:rgba(15,42,31,.10); --field-border:rgba(15,42,31,.16);
  --field-bg:rgba(255,255,255,.85);
  --done-bg:#DDF1E6; --done-fg:#0B5C37; --done-c:#0B6B41;
  --ok-bg:#E8F6EE;   --ok-fg:#14653F;   --ok-c:#74C99B;
  --late-bg:#FDECC8; --late-fg:#7A4100; --late-c:#E0912A; --late-ring:#C26A00;
  --risk-bg:#FDE3D6; --risk-fg:#9A2B06; --risk-c:#C2410C;
  --na-bg:#ECF0EE;   --na-fg:#3F5A4D;   --na-c:#CDD8D2;
  --info-bg:#E7EEF9; --info-fg:#1E4A85;
  --error:#B42318; --error-bg:#FFF1EC;
  --disabled:#A9C9B8; --white:#FFFFFF;
  --r-sm:10px; --r-md:12px; --r-lg:16px; --r-full:999px;
  --shadow:0 1px 2px rgba(12,64,40,.05),0 10px 30px rgba(12,64,40,.07);
  --shadow-cta:0 6px 16px rgba(15,122,74,.25);
  --font:'IBM Plex Sans Thai',"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--font);font-size:15px;line-height:1.65;color:var(--text);
  background:
    radial-gradient(1100px 620px at 8% -10%,#CDEEDB 0%,transparent 60%),
    radial-gradient(900px 560px at 100% 10%,#DFF3E8 0%,transparent 60%),
    radial-gradient(800px 600px at 60% 110%,#D3EEDF 0%,transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);box-shadow:var(--shadow);border-radius:var(--r-lg)}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(255,255,255,.92)}}
:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* mock banner */
.mockbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--brand-800);color:var(--white);font-size:13px}
.mockbar b{font-weight:600}
.mockbar label{display:flex;align-items:center;gap:8px}
.mockbar select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:var(--white);border-radius:8px;padding:2px 8px;min-height:28px}
.mockbar select option{color:var(--text);background:var(--white)}

/* shell */
.app{display:flex;gap:20px;align-items:flex-start;padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{width:256px;flex:none;position:sticky;top:20px;padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--brand-600);color:var(--white);display:grid;place-items:center;box-shadow:var(--shadow-cta)}
.brand-mark svg.i{width:22px;height:22px}
.brand b{display:block;font-size:14px;line-height:1.3}
.brand span{font-size:12px;color:var(--text-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 12px;border:0;border-radius:var(--r-sm);background:transparent;cursor:pointer;text-align:left;color:var(--text-2);font-weight:500;transition:background .15s ease-out}
.nav button:hover{background:rgba(255,255,255,.7)}
.nav button[aria-current="page"]{background:var(--white);color:var(--brand-700);box-shadow:0 1px 2px rgba(12,64,40,.08)}
.nav .badge{margin-left:auto}
.nav-label{font-size:12px;letter-spacing:.04em;color:var(--text-muted);padding:0 12px;margin-bottom:4px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--r-md);background:rgba(255,255,255,.6)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-50);color:var(--brand-800);display:grid;place-items:center;font-weight:600;flex:none}
.me b{display:block;font-size:13px;line-height:1.35}
.me span{font-size:12px;color:var(--text-muted)}
main{flex:1;min-width:0;max-width:1240px;display:flex;flex-direction:column;gap:20px}
.bottomnav{display:none}
.mtop{display:none}

/* page header */
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.ph h1{font-size:28px;line-height:1.3;margin:0;text-wrap:balance;font-weight:700}
.ph p{margin:4px 0 0;color:var(--text-muted);font-size:14px}
.ph-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--brand-700);background:none;border:0;padding:0;cursor:pointer;font-weight:500;min-height:24px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--field-border);background:rgba(255,255,255,.7);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s ease-out,box-shadow .15s ease-out,transform .15s ease-out}
.btn:hover{background:var(--white)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand-600);border-color:var(--brand-600);color:var(--white);box-shadow:var(--shadow-cta)}
.btn.primary:hover{background:var(--brand-700)}
.btn.danger{color:var(--risk-fg);border-color:rgba(194,65,12,.35)}
.btn[aria-disabled="true"],.btn:disabled{background:var(--disabled);border-color:var(--disabled);color:var(--white);box-shadow:none;cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px 12px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req{font-size:12px;font-weight:500;color:var(--error)}
.opt{font-size:12px;font-weight:400;color:var(--text-muted)}
.hint{font-size:13px;color:var(--text-muted)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--field-border);background:var(--field-bg);transition:border-color .15s ease-out}
textarea.input{min-height:96px;resize:vertical;line-height:1.6}
.input:hover{border-color:rgba(15,42,31,.3)}
.input[readonly]{background:rgba(236,240,238,.7)}
.input[aria-invalid="true"]{border-color:var(--error);background:var(--error-bg)}
.ferr{display:flex;gap:6px;align-items:flex-start;color:var(--error);font-size:13px;font-weight:500}
.ferr svg.i{width:16px;height:16px;margin-top:3px}
.suffix{display:flex;align-items:stretch}
.suffix .input{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.suffix span{display:flex;align-items:center;padding:0 12px;border:1px solid var(--field-border);border-left:0;border-radius:0 var(--r-sm) var(--r-sm) 0;background:rgba(236,240,238,.8);font-size:14px;color:var(--text-2);white-space:nowrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:var(--r-full);font-size:13px;font-weight:500;white-space:nowrap;line-height:1.7}
.st-DONE{background:var(--done-bg);color:var(--done-fg)}
.st-ON_TRACK{background:var(--ok-bg);color:var(--ok-fg)}
.st-LATE{background:var(--late-bg);color:var(--late-fg)}
.st-BELOW_TARGET{background:var(--risk-bg);color:var(--risk-fg)}
.st-NOT_DUE{background:var(--na-bg);color:var(--na-fg)}
.wf-DRAFT{background:var(--na-bg);color:var(--na-fg)}
.wf-SUBMITTED,.wf-REVIEWED{background:var(--info-bg);color:var(--info-fg)}
.wf-APPROVED{background:var(--done-bg);color:var(--done-fg)}
.wf-RETURNED,.wf-NONE{background:var(--late-bg);color:var(--late-fg)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:var(--r-full);background:var(--late-c);color:var(--white);font-size:12px;font-weight:600}
.vbadge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand-600);color:var(--white);font-weight:700;font-size:15px;flex:none}

/* cards */
.card{padding:20px}
.card h2{font-size:18px;margin:0 0 4px;line-height:1.4}
.card-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.card-head p{margin:0;font-size:13px;color:var(--text-muted)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:13px;color:var(--text-muted);font-weight:500}
.kpi .v{font-size:36px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.kpi .v small{font-size:18px;font-weight:500;color:var(--text-muted)}
.kpi .s{font-size:13px;color:var(--text-2)}
.bar{height:8px;border-radius:var(--r-full);background:var(--na-bg);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--brand-600);border-radius:inherit}
.row2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}

/* stacked status bar */
.stack{display:flex;height:22px;border-radius:var(--r-full);overflow:hidden;gap:2px;background:rgba(255,255,255,.6)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-weight:600;color:var(--text)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.c-DONE{background:var(--done-c)}.c-ON_TRACK{background:var(--ok-c)}.c-LATE{background:var(--late-c)}.c-BELOW_TARGET{background:var(--risk-c)}.c-NOT_DUE{background:var(--na-c)}

/* RUBBER cards */
.values{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.vcard{text-align:left;cursor:pointer;padding:16px;display:flex;flex-direction:column;gap:8px;border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.55);transition:background .15s ease-out,box-shadow .15s ease-out}
.vcard:hover{background:var(--white);box-shadow:var(--shadow)}
.vcard-top{display:flex;align-items:center;gap:10px}
.vletter{font-size:30px;font-weight:700;line-height:1;color:var(--brand-700);width:34px}
.vcard b{display:block;font-size:15px;line-height:1.35}
.vcard .dim{font-size:12px;color:var(--text-muted)}
.mini{display:flex;gap:3px}
.mini i{flex:1;height:8px;border-radius:3px}
.vcard p{margin:0;font-size:13px;color:var(--text-2)}

/* follow list */
.follow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.follow li+li{border-top:1px solid var(--line)}
.follow button{width:100%;display:flex;gap:12px;align-items:center;padding:12px 4px;background:none;border:0;cursor:pointer;text-align:left;border-radius:8px}
.follow button:hover{background:rgba(255,255,255,.6)}
.follow .t{flex:1;min-width:0}
.follow .t b{display:block;font-weight:500;font-size:14px;line-height:1.45}
.follow .t span{font-size:12px;color:var(--text-muted)}
.idtag{font-weight:600;font-size:13px;color:var(--brand-700);width:30px;flex:none}

/* month chart */
.mchart{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;padding-top:6px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.mbars{display:flex;gap:2px;align-items:flex-end;height:110px;width:100%;justify-content:center}
.mbars i{width:min(12px,40%);border-radius:3px 3px 0 0;display:block}
.mbars .due{background:var(--na-c)}
.mbars .ontime{background:var(--brand-600)}
.mcol small{font-size:11px;color:var(--text-muted)}
.mcol.cur small{color:var(--brand-700);font-weight:600}
.nextbar{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:var(--r-sm);background:var(--brand-25);color:var(--brand-800);font-size:14px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px}
.filters .field{flex:1 1 200px}
.filters .search{flex:2 1 280px;position:relative}
.filters .search svg.i{position:absolute;left:12px;bottom:13px;color:var(--text-muted)}
.filters .search .input{padding-left:38px}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex-basis:100%}
.fchip{min-height:34px;padding:4px 14px;border-radius:var(--r-full);border:1px solid var(--field-border);background:rgba(255,255,255,.7);cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--brand-600);border-color:var(--brand-600);color:var(--white)}

/* activities table */
.tablewrap{overflow-x:auto;border-radius:var(--r-lg)}
table.acts{width:100%;border-collapse:collapse;min-width:1080px;font-size:14px}
.acts th{font-size:12px;font-weight:600;color:var(--text-muted);text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.acts td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.acts tr.grp td{background:rgba(227,244,234,.6);padding:10px;font-weight:600;color:var(--brand-800)}
.acts tr.grp td span{font-weight:400;color:var(--text-2);margin-left:6px}
.acts tbody tr.arow{cursor:pointer;transition:background .15s ease-out}
.acts tbody tr.arow:hover{background:rgba(255,255,255,.7)}
.acts .nm a{font-weight:600;color:var(--text);text-decoration:none}
.acts .nm a:hover{text-decoration:underline}
.acts .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.acts .kpi-t{color:var(--text-2);max-width:240px}
.prog{min-width:120px}
.prog .bar{height:6px;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(12,16px);gap:3px}
.cal-h{display:grid;grid-template-columns:repeat(12,16px);gap:3px;font-size:10px;color:var(--text-muted);text-align:center;font-weight:500}
.cal i{width:16px;height:16px;border-radius:4px;display:block;position:relative}
.cal .sent{background:var(--done-c)}
.cal .due{background:var(--late-bg);border:2px solid var(--late-ring)}
.cal .future{border:1.5px solid var(--ok-c);background:rgba(255,255,255,.5)}
.cal .none::after{content:"";position:absolute;left:3px;right:3px;top:7px;height:2px;border-radius:2px;background:var(--na-c)}
.cal .cur{outline:2px solid var(--brand-800);outline-offset:1px}
.callegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-2);padding:12px 16px}
.callegend span{display:inline-flex;gap:6px;align-items:center}
.callegend .cal i{flex:none}
.empty{padding:48px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--text-2)}
.empty b{font-size:18px;color:var(--text)}

/* report page */
.rhead{padding:20px;display:flex;flex-direction:column;gap:14px}
.rhead-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.rhead h1{margin:0;font-size:24px;line-height:1.4;text-wrap:balance}
.rhead .meta{font-size:14px;color:var(--text-muted)}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sum3>div{padding:12px 14px;border-radius:var(--r-md);background:rgba(255,255,255,.6);border:1px solid var(--line)}
.sum3 span{display:block;font-size:12px;color:var(--text-muted)}
.sum3 b{font-size:22px;font-weight:700}
.sum3 small{font-size:13px;color:var(--text-muted);font-weight:500}
.rlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.form{padding:22px;display:flex;flex-direction:column;gap:20px}
.form h2{font-size:18px;margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.radios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border:0;padding:0;margin:0}
.radios legend{font-weight:600;font-size:14px;margin-bottom:6px;padding:0;display:flex;gap:8px;align-items:center}
.rcard{position:relative;display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-md);border:1px solid var(--field-border);background:var(--field-bg);cursor:pointer;min-height:44px}
.rcard input{margin:4px 0 0;accent-color:var(--brand-600);width:16px;height:16px;flex:none}
.rcard b{display:block;font-size:14px;line-height:1.4}
.rcard span{font-size:12px;color:var(--text-muted)}
.rcard:has(input:checked){border-color:var(--brand-600);background:var(--brand-25);box-shadow:inset 0 0 0 1px var(--brand-600)}
.rcard:has(input:focus-visible){outline:2px solid var(--brand-600);outline-offset:2px}
.counter{font-size:12px;color:var(--text-muted);text-align:right}
.counter.over{color:var(--error);font-weight:600}
.errsum{border:1px solid rgba(180,35,24,.35);background:var(--error-bg);border-radius:var(--r-md);padding:14px 16px;color:var(--error)}
.errsum b{display:flex;gap:8px;align-items:center}
.errsum ul{margin:6px 0 0;padding-left:22px}
.errsum a{color:var(--error);font-weight:500}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border:1.5px dashed rgba(15,122,74,.45);border-radius:var(--r-md);background:rgba(232,246,238,.5);text-align:center;cursor:pointer;color:var(--text-2);font-size:14px}
.drop:hover,.drop.over{background:var(--brand-25);border-color:var(--brand-600)}
.drop b{color:var(--brand-700)}
.drop:has(input:focus-visible){outline:2px solid var(--brand-600);outline-offset:2px}
.linkrow{display:flex;gap:8px}
.linkrow .input{flex:1;min-width:0}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-sm);background:rgba(255,255,255,.7);border:1px solid var(--line);font-size:14px}
.files .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fs{font-size:12px;color:var(--text-muted);white-space:nowrap}
.files .ok{color:var(--done-fg);font-size:12px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.files .up{color:var(--info-fg);font-size:12px;white-space:nowrap}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--text-muted);flex:none}
.iconbtn:hover{background:var(--na-bg);color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.actions .note{margin-right:auto;font-size:13px;color:var(--text-muted)}
.ro{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px 16px;margin:0;font-size:14px}
.ro dt{color:var(--text-muted)}
.ro dd{margin:0;white-space:pre-line}
.decision{padding:16px;border-radius:var(--r-md);background:var(--info-bg);display:flex;flex-direction:column;gap:12px}
.decision b{color:var(--info-fg)}
.aside{display:flex;flex-direction:column;gap:16px}
.aside .card{padding:18px}

const SENT=['SUBMITTED','REVIEWED','APPROVED'];
const STATUS={
  DONE:{t:'เสร็จสิ้น',s:'✓'},ON_TRACK:{t:'ตามแผน',s:'●'},LATE:{t:'ล่าช้า',s:'!'},
  BELOW_TARGET:{t:'ต่ำกว่าเป้า',s:'▼'},NOT_DUE:{t:'ยังไม่ถึงกำหนด',s:'○'}
};

const reportsOf=no=>Object.values(R).filter(r=>r.no===no).sort((a,b)=>a.p-b.p);
function latestApproved(no){return reportsOf(no).filter(r=>r.state==='APPROVED').pop()}
function compute(a){
  const reps=reportsOf(a.no), rep=p=>R[key(a.no,p)];
  const overdue=a.planned.filter(p=>dueDate(p)<NOW && !(rep(p)&&SENT.includes(rep(p).state)));
  const latestSent=reps.filter(r=>SENT.includes(r.state)).pop();
  const ap=latestApproved(a.no), val=ap?ap.actual:null;
  const last=Math.max(...a.planned);
  const progress=val==null?0:Math.min(val/a.target,1);
  let st;
  if(overdue.length || (latestSent&&latestSent.progress==='DELAYED')) st='LATE';
  else if(dueDate(last)<NOW && (val==null||val<a.target)) st='BELOW_TARGET';
  else if(val!=null && val>=a.target && rep(last)?.state==='APPROVED') st='DONE';
  else if(Math.min(...a.planned)>CUR) st='NOT_DUE';
  else st='ON_TRACK';
  return {st,val,progress,overdue,ap};
}

    if(!r||r.state==='DRAFT'||r.state==='RETURNED') todo.push({a,p,r});
    else if(r.state==='SUBMITTED'||r.state==='REVIEWED') wait.push({a,p,r});
    else if(p>=CUR-1) done.push({a,p,r});
  }));
  todo.sort((x,y)=>x.p-y.p);
  return {todo,wait,done};
}
function inbox(role){
  const want=role==='GROUP_HEAD'?['SUBMITTED']:role==='DIRECTOR'?['REVIEWED']:['SUBMITTED','REVIEWED'];
  return Object.values(R).filter(r=>want.includes(r.state)).sort((a,b)=>a.submittedAt-b.submittedAt);
}

function canEdit(r){return ['STAFF','GROUP_HEAD'].includes(S.role) && (!r||['DRAFT','RETURNED'].includes(r.state))}

  return S.form;

function prevApproved(a,p){return reportsOf(a.no).filter(r=>r.p<p&&r.state==='APPROVED').pop()}
function validate(a,p,v){
  const e={};
  if(v.actual===''||v.actual==null) e.actual='กรอกผลการดำเนินงาน';
  else if(isNaN(+v.actual)||+v.actual<0) e.actual='ผลต้องเป็นตัวเลขไม่ติดลบ';
  else if(a.unit==='ร้อยละ'&&+v.actual>100) e.actual='ค่าร้อยละต้องไม่เกิน 100';
  else if(a.type==='COUNT_CUMULATIVE'){const pr=prevApproved(a,p);if(pr&&+v.actual<pr.actual)e.actual=`ยอดสะสมต้องไม่น้อยกว่ารอบก่อน (${pr.actual} ${a.unit})`}
  if(!v.progress) e.progress='เลือกสถานะการดำเนินงาน';
  if(!v.summary.trim()) e.summary='กรอกสรุปผลการดำเนินงาน';
  else if(v.summary.length>1000) e.summary='สรุปผลยาวเกิน 1,000 ตัวอักษร';
  if((v.progress==='DELAYED'||v.progress==='NOT_STARTED')&&!v.issues.trim()) e.issues='ระบุปัญหา/อุปสรรค เมื่อสถานะล่าช้าหรือยังไม่เริ่ม';
  if(v.progress==='DELAYED'&&!v.eta) e.eta='ระบุวันที่คาดว่าจะแล้วเสร็จ';
  return e;
}

        <div class="field"><label for="f-comment">ความเห็น <span class="opt">(จำเป็นเมื่อส่งกลับแก้ไข)</span></label><textarea class="input" id="f-comment" rows="3"></textarea><div id="cmtErr"></div></div>

      return `<li><button data-act="open" data-no="${a.no}" data-p="${pp}" aria-current="${pp===p}"><span class="m">${pLabel(pp)}</span>${s?wfchip(s):'<span class="hint">ยังไม่ถึงรอบ</span>'}<span class="v num">${x?fmtVal(a,x.actual):''}</span></button></li>`}).join('')}</ul>

    <section class="glass card"><h3>พฤติกรรมที่คาดหวัง</h3><p class="hint" style="margin:-6px 0 8px">${esc(a.outcome)}</p>
      ${Object.entries(roles).map(([ro,l],i)=>`<details class="dd"${i===0?' open':''}><summary>${esc(ro)}</summary><div class="lists">
        <span class="dohead" style="color:var(--done-fg)">${ic('thumbup')}ควรทำ (Do)</span><ul class="dolist do">${l.do.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
        ${l.dont.length?`<span class="dohead" style="color:var(--risk-fg)">${ic('ban')}ไม่ควรทำ (Don't)</span><ul class="dolist dont">${l.dont.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}</div></details>`).join('')}
    </section></aside>`;

  return `
  <button class="crumb" data-act="back">${ic('back')}กลับ</button>
  <section class="glass rhead">
    <div class="rhead-top"><span class="vbadge" title="${esc(g.name)}">${g.code}</span><b>กิจกรรม ${a.no}</b><span class="hint">${esc(g.name)} · ${esc(g.dim)}</span>${chip(c.st)}</div>
    <h1>${esc(a.name)}</h1>
    <div class="meta">กลุ่มเป้าหมาย: ${esc(a.tg)} · ผู้รับผิดชอบ: ${esc(a.owner)}<br>ตัวชี้วัด: ${esc(a.kpi)}</div>
    <div class="sum3">
      <div><span>ค่าเป้าหมาย</span><b class="num">${a.target}</b> <small>${esc(a.unit)}</small></div>
      <div><span>ผลที่อนุมัติล่าสุด</span><b class="num">${c.val??'–'}</b> <small>${c.ap?pLabel(c.ap.p):'ยังไม่มี'}</small></div>
      <div><span>ความคืบหน้า</span><b class="num">${Math.round(c.progress*100)}%</b><div class="bar"><i style="width:${c.progress*100}%"></i></div></div>
    </div>
  </section>
  <div class="rlayout">${main}${aside}</div>`;
}

2. คิดว่า "ไม่เป็นไรหรอก" เมื่อเห็นจุดเสี่ยงเล็ก ๆ น้อย ๆ
3. เพิกเฉยต่อป้ายเตือนหรือข้อบังคับในพื้นที่ทำงาน
4. ทำผิดระเบียบเพียงเพราะเห็นว่าเพื่อนร่วมงานคนอื่นก็ทำ
5. ไม่ยอมศึกษาหาความรู้เพิ่มเติมเกี่ยวกับสายงานของตนเอง`]},
 {dim:'Understand impact',c:[
`1. ประเมินผลเสียและโอกาสอย่างรอบด้านก่อนตัดสินใจเชิงนโยบาย
2. มองผลกระทบในระยะยาว ไม่ใช่เพียงแค่ผลลัพธ์ในระยะสั้น
3. พิจารณาผลกระทบต่อภาพลักษณ์และชื่อเสียงขององค์กร
4. สอบถามถึงผลกระทบที่จะเกิดกับผู้มีส่วนได้ส่วนเสียทุกกลุ่ม
5. ทำความเข้าใจห่วงโซ่ผลกระทบหากโครงการสำคัญล้มเหลว`,
`1. มองโลกในแง่ดีเกินไปจนลืมพิจารณาแผนสำรอง
2. ตัดสินใจจากสัญชาตญาณโดยไม่ดูข้อมูลผลวิเคราะห์ความเสียหาย
3. สนใจแต่ผลลัพธ์ทางการเงิน โดยละทิ้งผลกระทบทางสังคมและสิ่งแวดล้อม
4. ประเมินความเสียหายระดับองค์กรต่ำกว่าความเป็นจริง
5. มองข้ามความเดือดร้อนที่อาจเกิดกับเกษตรกรหรือชุมชนรอบข้าง`,
`1. วิเคราะห์ว่าความเสี่ยงใดจะทำให้องค์กรไปไม่ถึงเป้าหมาย
2. ใช้ข้อมูลสถิติหรือข้อเท็จจริงมาช่วยประเมินความรุนแรง
3. วางแผนฉุกเฉินเพื่อรองรับสถานการณ์ที่เลวร้ายที่สุด
4. ประเมินผลกระทบที่อาจลุกลามข้ามสายงานเป็นโดมิโน
5. อธิบายให้คณะกรรมการเห็นภาพรวมของผลกระทบได้อย่างชัดเจน`,
`1. ปกปิดหรือบิดเบือนตัวเลขความเสียหายที่แท้จริง
2. ประเมินผลกระทบแบบผิวเผิน ไม่ลงลึกถึงรากฐานของปัญหา
3. ไม่เตรียมงบประมาณส่วนกลางเผื่อไว้สำหรับกรณีฉุกเฉิน
4. ผลักภาระความเสียหายหรือผลกระทบไปให้สายงานอื่นรับผิดชอบ
5. ตัดสินใจแก้ปัญหาเฉพาะหน้าโดยไม่มองผลกระทบระยะยาว`,
`1. ประเมินความเสียหายต่อปริมาณงานและเวลาหากเกิดข้อผิดพลาด
2. จัดลำดับความสำคัญของปัญหาว่าเรื่องใดส่งผลกระทบรุนแรงกว่ากัน
3. อธิบายให้ทีมงานเห็นผลเสียที่ชัดเจนหากปฏิบัติงานผิดพลาด
4. รวบรวมข้อมูลความเสียหายที่เคยเกิดขึ้นจริงเพื่อเป็นกรณีศึกษา
5. ประเมินผลกระทบต่อขวัญและกำลังใจของบุคลากรในทีม`,
`1. สุ่มจัดการปัญหาโดยไม่จัดลำดับความสำคัญของผลกระทบ
2. สั่งงานโดยไม่บอกผู้ปฏิบัติงานว่าหากทำพลาดจะเกิดผลเสียอย่างไร
3. ประเมินความรุนแรงของปัญหาต่ำกว่าจริงเพื่อหลีกเลี่ยงความผิด
4. ไม่บันทึกประวัติความเสียหายหรือข้อผิดพลาดไว้เป็นหลักฐาน
5. ปล่อยให้ปัญหาลุกลามจนส่งผลกระทบต่อหน่วยงานข้างเคียง`,
`1. รู้ว่าหากตนเองทำงานพลาด จะสร้างความเดือดร้อนถึงใครบ้าง
2. เข้าใจผลเสียของการไม่ปฏิบัติตามขั้นตอนการควบคุมความเสี่ยง
3. คิดถึงความปลอดภัยของตนเองและเพื่อนร่วมงานเสมอ
4. ประเมินทรัพยากร (เวลา/วัสดุ) ที่ต้องสูญเสียหากต้องรื้องานทำใหม่
5. ตระหนักถึงความพึงพอใจของเกษตรกรและผู้มารับบริการ`,
`1. คิดว่าทำงานพลาดก็แค่แก้ไขใหม่ ไม่ได้สร้างความเสียหายอะไร
2. โยนความผิดให้ระบบหรืออุปกรณ์เมื่อเกิดผลกระทบจากการทำงาน
3. ไม่สนใจว่างานที่ส่งต่อจะทำให้เพื่อนร่วมงานทำงานลำบากขึ้น
4. ละเลยเรื่องความปลอดภัยจนอาจส่งผลเสียต่อร่างกายและชีวิต
5. ให้บริการโดยไม่คำนึงถึงความรู้สึกและผลกระทบต่อผู้รับบริการ`]},
 {dim:'Be proactive',c:[
`1. เสนอแนะแนวทางการป้องกันวิกฤตตั้งแต่ปัญหายังไม่เกิด
2. สนับสนุนงบประมาณสำหรับเครื่องมือป้องกันความเสี่ยงอย่างเหมาะสม
3. ผลักดันให้มีการเตรียมพร้อมและจำลองสถานการณ์ฉุกเฉินระดับองค์กร
4. กำหนดวิสัยทัศน์ให้องค์กรมองข้ามช็อตเพื่อรับมือการเปลี่ยนแปลง
5. ชื่นชมและสนับสนุนนโยบายที่เน้นการป้องกันมากกว่าการตามแก้ปัญหา`,
`1. รอมติที่ประชุมจนดำเนินการแก้ปัญหาหรือป้องกันไม่ทันการณ์
2. ตัดลดงบประมาณด้านความปลอดภัยโดยไม่ประเมินความเสี่ยง
3. มองว่าการเตรียมความพร้อมหรือการซ้อมแผนเป็นเรื่องสิ้นเปลือง
4. สนใจแก้ไขแต่อดีต ไม่ตั้งคำถามถึงความเสี่ยงในอนาคต
5. ตำหนิเพียงอย่างเดียวเมื่อเกิดปัญหา โดยไม่เคยเสนอแนะทางป้องกัน`,
`1. สั่งการปรับแผนงานทันทีเมื่อเห็นสัญญาณเตือนถึงความเสี่ยง
2. ส่งเสริมให้ใช้วิธีการหรือเทคโนโลยีใหม่ ๆ มาป้องกันความเสี่ยง
3. นำระบบฐานข้อมูลมาช่วยเตือนภัยล่วงหน้า
4. จัดซ้อมแผนฉุกเฉินหรือแผนความต่อเนื่องทางธุรกิจ (BCP) อย่างจริงจัง
5. ลงพื้นที่ตรวจเยี่ยมหน้างานเพื่อค้นหาจุดเสี่ยงด้วยตนเอง`,
`1. บริหารงานแบบตั้งรับ รอให้ปัญหาเกิดก่อนแล้วค่อยหาทางแก้
2. เพิกเฉยต่อข้อเสนอแนะด้านความปลอดภัยจากหน่วยงานปฏิบัติการ
3. ยึดติดกับวิธีการทำงานแบบเดิม ๆ แม้สถานการณ์ภายนอกจะเปลี่ยนไป
4. จัดซ้อมแผนฉุกเฉินเพียงแค่ในกระดาษเพื่อให้ผ่านเกณฑ์ประเมิน
5. นั่งทำงานแต่ในสำนักงาน ไม่รับรู้สภาพความเป็นจริงของพื้นที่`,
`1. เฝ้าระวังตัวเลขหรือสัญญาณเตือนที่บ่งบอกว่างานกำลังจะมีปัญหา
2. รีบรายงานผู้บังคับบัญชาทันทีเมื่อพบเห็นแนวโน้มความเสี่ยง
3. วางแผนสำรอง (Plan B) ไว้ล่วงหน้าสำหรับงานสำคัญเสมอ
4. กระตุ้นให้ลูกน้องเสนอไอเดียใหม่ ๆ ในการป้องกันข้อผิดพลาด
5. ตรวจเช็กสภาพเครื่องมือ ระบบ และอุปกรณ์ให้พร้อมใช้งานอยู่เสมอ`,
`1. เห็นสัญญาณเตือนแล้วแต่ปล่อยผ่าน คิดว่าเดี๋ยวสถานการณ์ก็ดีขึ้นเอง
2. รอให้ปัญหากลายเป็นเรื่องใหญ่ก่อนจึงค่อยรายงานผู้ใหญ่
3. ไม่มีแผนรองรับเมื่อสถานการณ์หน้างานไม่เป็นไปตามที่คิดไว้
4. ปิดกั้นความคิดเห็นของลูกน้องที่เสนอวิธีทำงานแบบใหม่
5. ละเลยการบำรุงรักษาอุปกรณ์ รอให้พังก่อนแล้วค่อยแจ้งซ่อม`,
`1. รีบแจ้งหัวหน้างานทันทีที่พบความผิดปกติในกระบวนการทำงาน
2. กล้ารายงานเหตุการณ์ที่เกือบจะเกิดความเสียหาย (Near Miss) เพื่อหาทางป้องกัน
3. ตรวจสอบความพร้อมของข้อมูลหรืออุปกรณ์ก่อนเริ่มงานทุกครั้ง
4. นำเสนอวิธีการทำงานที่รวดเร็ว ปลอดภัย และสร้างสรรค์กว่าเดิม
5. ช่วยสอดส่องดูแลสภาพแวดล้อมในที่ทำงานให้ปลอดภัย`,
`1. ปล่อยสิ่งของชำรุดทิ้งไว้โดยไม่แจ้งผู้เกี่ยวข้องให้รับทราบ
2. ปกปิดเรื่องที่เกือบทำพลาดเพราะกลัวจะโดนตำหนิหรือถูกหักคะแนน
3. รีบเร่งทำงานโดยไม่ตรวจเช็กความเรียบร้อยก่อนลงมือ
4. เห็นเพื่อนร่วมงานทำพฤติกรรมเสี่ยงแต่ไม่เตือนหรือห้ามปราม
5. นิ่งเฉยเมื่อเห็นบุคคลภายนอกเข้ามาในพื้นที่ปฏิบัติงานโดยไม่ได้รับอนุญาต`]},
 {dim:'Build accountability',c:[
`1. กำหนดให้มีผู้รับผิดชอบด้านความเสี่ยงในระดับนโยบายอย่างชัดเจน
2. ติดตามความคืบหน้าและการแก้ปัญหาจากผู้รับผิดชอบโดยตรง
3. แสดงความรับผิดชอบร่วมกันในฐานะผู้นำเมื่อองค์กรเผชิญวิกฤต
4. กำหนดเป้าหมายการทำงานขององค์กรที่โปร่งใสและตรวจสอบได้
5. ประเมินผลงานผู้บริหารโดยนำเรื่องการจัดการความเสี่ยงมาเป็นเกณฑ์`,
`1. โยนความผิดให้ผู้บริหารระดับสูงเมื่อนโยบายเกิดความผิดพลาด
2. แต่งตั้งผู้รับผิดชอบด้านความเสี่ยงแต่ไม่มอบอำนาจในการตัดสินใจ
3. หลีกเลี่ยงการตอบคำถามต่อสาธารณชนเมื่อองค์กรเกิดข้อผิดพลาดใหญ่
4. บริหารงานแบบไม่โปร่งใส ขาดการตรวจสอบถ่วงดุล
5. ประเมินผลงานโดยดูเฉพาะผลกำไร ไม่สนใจความเสี่ยงที่ซ่อนอยู่`,
`1. มอบหมายหน้าที่การจัดการความเสี่ยงให้หัวหน้าสายงานอย่างไม่ซ้ำซ้อน
2. ติดตามผลการจัดการความเสี่ยงตามรอบเวลาอย่างจริงจัง
3. ยืดอกรับผิดชอบแทนผู้ใต้บังคับบัญชาเมื่อเกิดเหตุสุดวิสัยระดับโครงสร้าง
4. ให้รางวัลหรือคำชมแก่พนักงานที่ช่วยองค์กรลดความเสียหาย
5. สร้างบรรยากาศการทำงานที่ไว้เนื้อเชื่อใจและการทำงานเป็นทีม`,
`1. โยนความผิดให้ระดับปฏิบัติการเมื่อเกิดข้อผิดพลาดระดับองค์กร
2. สั่งงานซ้ำซ้อนจนหน่วยงานต่าง ๆ เกี่ยงกันรับผิดชอบ
3. สั่งงานแล้วไม่ติดตามผล ปล่อยให้ระบบเดินไปเองตามยถากรรม
4. นำความดีความชอบของผู้ใต้บังคับบัญชามาเป็นของตนเองคนเดียว
5. สร้างความหวาดระแวงในองค์กรด้วยวัฒนธรรมการจับผิด`,
`1. แบ่งงานและระบุตัวบุคคลผู้รับผิดชอบความเสี่ยงในทีมอย่างชัดเจน
2. ตรวจสอบคุณภาพและมาตรฐานงานของทีมอย่างสม่ำเสมอ
3. รับผิดชอบและร่วมแก้ปัญหาต่อความผิดพลาดของทีมงานในความดูแล
4. อธิบายเหตุผลให้ทีมเข้าใจความสำคัญของการทำตามความคาดหวัง
5. เป็นที่ปรึกษาคอยช่วยเหลือเมื่อลูกน้องเจอปัญหาอุปสรรคในงาน`,
`1. สั่งงานแบบลอย ๆ ไม่มีผู้รับผิดชอบหลัก (ไม่มีเจ้าภาพ)
2. ปล่อยปละละเลย ไม่ตรวจทานความถูกต้องของงานก่อนส่งต่อให้หน่วยอื่น
3. ตำหนิและโยนความผิดให้ลูกน้องเป็นรายบุคคลต่อหน้าผู้บริหารระดับสูง
4. ใช้ระบบความสนิทสนมส่วนตัวในการแบ่งความรับผิดชอบงาน
5. ทิ้งให้ผู้ปฏิบัติงานเผชิญปัญหาและแก้ไขสถานการณ์ตามลำพัง`,
`1. รับผิดชอบงานที่ได้รับมอบหมายให้สำเร็จ ถูกต้อง และปลอดภัย
2. ปฏิบัติตามกฎระเบียบอย่างเคร่งครัดแม้ในเวลาที่ไม่มีใครคอยควบคุม
3. กล้ายอมรับผิดและลงมือแก้ไขทันทีเมื่อตนเองทำพลาด
4. ช่วยเหลือเพื่อนร่วมงานเมื่อเห็นว่ามีปัญหาหรือรับภาระงานที่เสี่ยงเกินไป
5. ดูแลรักษาเครื่องมือและทรัพย์สินขององค์กรเสมือนเป็นของตนเอง`,
`1. เกี่ยงงานหรือปัดความรับผิดชอบเมื่อเห็นว่าเป็นงานที่ยุ่งยาก
2. แอบลัดขั้นตอนหรือละเมิดระเบียบเมื่อหัวหน้าไม่อยู่ในพื้นที่
3. โกหก ซ่อนเร้น หรือทำลายหลักฐานเมื่อตนเองทำงานผิดพลาด
4. นิ่งเฉยและปล่อยผ่านเมื่อเห็นเพื่อนร่วมงานกำลังทำผิดขั้นตอน
5. ใช้ทรัพย์สินขององค์กรในเรื่องส่วนตัวจนเกิดความเสียหายหรือสูญหาย`]},
 {dim:'Review & Improve',c:[
`1. ทบทวนนโยบายความเสี่ยงอย่างน้อยปีละครั้งให้ทันต่อเหตุการณ์เศรษฐกิจโลก
2. ส่งเสริมและให้ทุนสำหรับการวิจัยพัฒนานวัตกรรมเพื่อลดความเสี่ยงองค์กร
3. เปิดใจรับฟังข้อเสนอแนะจากผู้ตรวจสอบภายนอกเพื่อนำมาปรับปรุง
4. ประเมินผลงานของคณะกรรมการเองเพื่อหาจุดอ่อนและพัฒนาการทำงาน
5. สั่งการให้มีการถอดบทเรียน (Lessons Learned) จากวิกฤตการณ์ที่ผ่านมา`,
`1. ใช้นโยบายความเสี่ยงฉบับเดิมติดต่อกันหลายปีโดยไม่มีการปรับปรุงให้ทันสมัย
2. มองว่านวัตกรรมและการพัฒนาสิ่งใหม่เป็นเรื่องไกลตัวและไม่สนับสนุนงบประมาณ
3. มองผู้ประเมินภายนอกหรือผู้ตรวจสอบเป็นศัตรู และไม่ยอมรับฟังข้อเสนอแนะ
4. ไม่ยอมรับข้อบกพร่องของตนเองในระดับคณะกรรมการ
5. ปล่อยให้วิกฤตผ่านพ้นไปโดยไม่ได้เรียนรู้หรือสร้างมาตรการป้องกันระยะยาว`,
`1. สั่งการให้ทบทวนแผนงานทันทีเมื่อผลลัพธ์การจัดการความเสี่ยงไม่เป็นไปตามเป้า
2. นำบทเรียนจากข้อผิดพลาดในอดีตมาเป็นกรณีศึกษาสำหรับผู้บริหารรุ่นถัดไป
3. ปรับปรุงคู่มือการปฏิบัติงานระดับองค์กรให้รัดกุมและสอดคล้องกับปัจจุบัน
4. นำข้อคิดเห็นของพนักงานระดับปฏิบัติการมาปรับปรุงระบบโครงสร้างการทำงาน
5. ศึกษาดูงานหรือรับเอาแนวปฏิบัติที่เป็นเลิศ (Best Practices) จากภายนอกมาใช้`,
`1. ดันทุรังใช้แผนงานเดิมทั้งที่ทราบจากผลประเมินแล้วว่าไม่ได้ผล
2. สั่งห้ามพูดถึงความผิดพลาดในอดีตเพื่อรักษาภาพลักษณ์ของสายงาน
3. ปล่อยให้คู่มือทำงานล้าสมัยและไม่ตรงกับสภาพการทำงานหน้างานจริง
4. เพิกเฉยต่อช่องทางรับฟังความคิดเห็นหรือเสียงสะท้อนจากผู้ปฏิบัติงาน
5. ปิดกั้นการเรียนรู้จากภายนอก คิดว่าองค์กรของตนมีระบบที่ดีที่สุดแล้ว`,
`1. ทบทวนเพื่อค้นหาสาเหตุที่แท้จริง (Root Cause) ทุกครั้งเมื่อเกิดเหตุขัดข้อง
2. ปรับปรุงขั้นตอนการทำงานในหน่วยงานให้มีความสะดวกรวดเร็วและปลอดภัยขึ้น
3. แลกเปลี่ยนเรียนรู้วิธีการแก้ปัญหาระหว่างแผนกเพื่อให้เกิดการพัฒนาข้ามสายงาน
4. ติดตามว่ามาตรการแก้ไขปรับปรุงที่สั่งการไปนั้นได้ผลลัพธ์ที่ดีขึ้นจริงหรือไม่
5. กระตุ้นหรือจัดกิจกรรมให้พนักงานในทีมเสนอแนวคิดในการปรับปรุงกระบวนการทำงาน`,
`1. มุ่งหาตัวคนผิดมาลงโทษมากกว่าหาสาเหตุของปัญหาเพื่อทำการแก้ไขระบบ
2. ยึดติดกับคำพูดที่ว่า "เมื่อก่อนก็ทำมาแบบนี้ ไม่เห็นเป็นอะไร" จนไม่เกิดการพัฒนา
3. แข่งขันชิงดีชิงเด่นกับแผนกอื่นจนไม่ยอมแบ่งปันข้อมูลที่เป็นประโยชน์ในการทำงาน
4. แก้ปัญหาลุล่วงเฉพาะหน้าแล้วจบไป ไม่มีการติดตามผลลัพธ์ในระยะยาว
5. นำไอเดียของลูกน้องไปแอบอ้าง หรือไม่สนับสนุนเมื่อลูกน้องคิดค้นวิธีการทำงานใหม่`,
`1. นำข้อผิดพลาดในการทำงานของตนเองมาเป็นบทเรียนเพื่อไม่ให้ทำผิดซ้ำอีก
2. เสนอแนะวิธีการปรับปรุงการทำงานที่ตนเองรับผิดชอบต่อหัวหน้างานอยู่เสมอ
3. หมั่นขวนขวายเรียนรู้ทักษะใหม่ ๆ เพื่อพัฒนาศักยภาพในการทำงานของตนเอง
4. อัปเดตความรู้เกี่ยวกับเครื่องมือ เทคโนโลยี หรือกฎเกณฑ์ใหม่ ๆ อย่างสม่ำเสมอ
5. นำคำติชมของผู้บังคับบัญชาหรือผู้รับบริการมาปรับปรุงตนเองด้วยใจที่เปิดกว้าง`,
`1. ทำงานผิดพลาดซ้ำซากในเรื่องเดิม ๆ โดยไม่มีการปรับปรุงแก้ไขพฤติกรรม
2. บ่นถึงปัญหาในการทำงานแต่ไม่เคยพยายามหาทางออกหรือเสนอวิธีแก้ไข
3. ต่อต้านการเปลี่ยนแปลง การเรียนรู้สิ่งใหม่ หรือการนำเทคโนโลยีมาใช้แทนระบบเดิม
4. ทำงานด้วยความรู้เดิมที่มีอยู่ ไม่ยอมศึกษาหรืออัปเดตวิธีปฏิบัติงานใหม่ ๆ
5. แสดงอาการไม่พอใจเมื่อได้รับคำติชม แนะนำ หรือข้อเสนอแนะเพื่อการพัฒนา`]},
 {dim:'Embed in process',c:[
`1. กำหนดให้นำเรื่องความเสี่ยงเป็นวาระประจำในการประชุมคณะกรรมการ
2. กำหนดให้ต้องมีการวิเคราะห์ความเสี่ยงประกอบการขออนุมัติงบประมาณทุกครั้ง
3. ผนวกการบริหารความเสี่ยงเข้ากับการกำหนดทิศทางและยุทธศาสตร์องค์กร
4. ผลักดันให้มีคู่มือการกำกับดูแลกิจการที่ดีเป็นมาตรฐานการทำงาน
5. สนับสนุนให้ใช้ระบบเทคโนโลยีเข้ามาช่วยควบคุมกระบวนการทำงานให้รัดกุม`,
`1. หยิบยกเรื่องความเสี่ยงมาพิจารณาเป็นวาระสุดท้ายที่เร่งรีบจนขาดความรอบคอบ
2. อนุมัติแผนงานใหญ่โดยไม่มีเอกสารการประเมินความเสี่ยงแนบมาด้วย
3. แยกการพิจารณาความเสี่ยงออกจากการจัดทำแผนวิสาหกิจหรือแผนกลยุทธ์
4. ปล่อยให้องค์กรดำเนินงานโดยไม่มีคู่มือหรือมาตรฐานที่อัปเดต
5. ปฏิเสธการลงทุนในระบบควบคุมอัตโนมัติเพราะมองว่ามีราคาแพงเกินไป`,
`1. กำหนดเงื่อนไขให้ทุกโครงการต้องระบุมาตรการลดความเสี่ยงพร้อมงบรองรับ
2. นำผลประเมินการจัดการความเสี่ยงไปเชื่อมโยงกับการพิจารณาผลงาน (KPI)
3. ออกแบบและสร้างมาตรฐานการทำงานที่ช่วยปิดช่องโหว่การทุจริต
4. กำหนดให้มีการรายงานความคืบหน้าด้านมาตรการควบคุมความเสี่ยงทุกไตรมาส
5. นำกระบวนการด้านความเสี่ยงขึ้นระบบออนไลน์เพื่อให้เข้าถึงและใช้งานง่าย`,
`1. แยกแผนบริหารความเสี่ยงไว้บนหิ้ง ไม่นำมาหลอมรวมกับแผนปฏิบัติการจริง
2. ประเมินผลงานพนักงานโดยดูแค่ตัวเลขความสำเร็จ ไม่สนว่าละเมิดกฎหรือไม่
3. ปล่อยให้มีขั้นตอนการทำงานที่คลุมเครือและเอื้อต่อการหาผลประโยชน์
4. สั่งให้ทำรายงานความเสี่ยงเพียงปีละครั้งเพื่อจัดส่งตามเกณฑ์เท่านั้น
5. สร้างกระบวนการควบคุมที่ซับซ้อนยุ่งยากจนพนักงานหาทางหลบเลี่ยง`,
`1. ประเมินความเสี่ยงและเตรียมมาตรการก่อนเริ่มลงมือทำโครงการทุกครั้ง
2. นำมาตรการป้องกันความเสี่ยงไปใส่ไว้ในขั้นตอนการทำงานประจำวัน
3. สุ่มตรวจการทำงานของลูกน้องว่าได้ทำตามขั้นตอนการควบคุมหรือไม่
4. สอดแทรกเรื่องการระมัดระวังความเสี่ยงในระหว่างการสอนงาน (Coaching)
5. จัดเตรียมอุปกรณ์ป้องกันหรือเครื่องมือควบคุมให้พร้อมอยู่ในพื้นที่ทำงาน`,
`1. เริ่มงานทันทีโดยไม่ประเมินสถานการณ์และมาตรการควบคุมล่วงหน้า
2. เก็บมาตรการป้องกันความเสี่ยงไว้ในแฟ้มประเมิน ไม่นำมาบังคับใช้จริง
3. ไม่เคยเดินตรวจหน้างาน ปล่อยให้พนักงานทำงานกันเองโดยไม่มีการควบคุม
4. สอนงานเฉพาะวิธีทำให้เสร็จ แต่ไม่สอนวิธีทำให้ปลอดภัยหรือถูกต้องตามเกณฑ์
5. ปล่อยให้พื้นที่ทำงานขาดความเป็นระเบียบและไม่มีอุปกรณ์ควบคุมที่จำเป็น`,
`1. ปฏิบัติงานตามคู่มือ ขั้นตอน หรือแนวทางปฏิบัติที่กำหนดไว้อย่างสม่ำเสมอ
2. นึกถึงข้อควรระวังและความเสี่ยงที่อาจเกิดขึ้นก่อนลงมือปฏิบัติงานทุกครั้ง
3. ตรวจสอบความถูกต้องตามแบบฟอร์ม (Checklist) ก่อนส่งมอบงาน
4. ใช้โปรแกรมหรือระบบที่องค์กรเตรียมไว้ให้เพื่อลดข้อผิดพลาดจากบุคคล
5. ปฏิบัติตามมาตรฐานความปลอดภัย อาชีวอนามัย และการควบคุมภายในอย่างเคร่งครัด`,
`1. ข้ามขั้นตอนในคู่มือปฏิบัติงานเพราะคิดว่าตนเองเชี่ยวชาญแล้ว
2. ทำงานด้วยความเร่งรีบโดยไม่หยุดคิดถึงผลกระทบหากเกิดข้อผิดพลาด
3. กรอกแบบฟอร์มตรวจสอบ (Checklist) แบบขอไปที หรือกรอกข้อมูลเท็จ
4. หลีกเลี่ยงการใช้งานระบบควบคุมที่องค์กรกำหนดเพราะมองว่ายุ่งยาก
5. ถอดอุปกรณ์ความปลอดภัยออกขณะทำงานเพื่อความสะดวกสบายส่วนตัว`]}
];
function vDoDont(){
  const d=DD[S.dd.g-1], ri=S.dd.role, items=s=>s.split('\n').map(l=>l.replace(/^\d+\.\s*/,''));
  const linked=A.filter(a=>GROUPS[a.group-1].dim===d.dim);
  return `
  <header class="ph"><div><h1>แนวทางการปฏิบัติตน Do &amp; Don't</h1><p>บุคลากร กยท. 4 บทบาท × 6 มิติ Risk Culture · จากแท็บ "แนวทางการปฏิบัติตน"</p></div></header>
  <section class="glass filters" aria-label="เลือกมิติและบทบาท" style="flex-direction:column;align-items:stretch">
    <div class="chips" role="group" aria-label="มิติ Risk Culture">${DD.map((x,i)=>`<button class="fchip" data-act="dd-g" data-g="${i+1}" aria-pressed="${S.dd.g===i+1}">${x.dim[0]} · ${esc(x.dim)}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="บทบาท">${DD_ROLES.map((r,i)=>`<button data-act="dd-r" data-r="${i}" aria-pressed="${ri===i}">${r}</button>`).join('')}</div>
  </section>
  <div class="ddgrid">
    <section class="glass ddcol do"><h3>${ic('thumbup')}พึงกระทำ</h3><ol>${items(d.c[ri*2]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>
    <section class="glass ddcol dont"><h3>${ic('ban')}ไม่พึงกระทำ</h3><ol>${items(d.c[ri*2+1]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>
  </div>
  <section class="glass card"><div class="card-head"><h2>กิจกรรมที่ส่งเสริมมิตินี้</h2><p>ตามการจัดกลุ่มใน Sheet1</p></div>
    <ul class="follow">${linked.map(a=>`<li><button data-act="open" data-no="${a.no}" data-p="${Math.max(...a.planned.filter(p=>p<CUR),a.planned[0])}"><span class="idtag">${a.no}</span><span class="t"><b>${esc(a.name)}</b><span>${esc(a.kpi)}</span></span>${chip(compute(a).st)}${ic('chevron')}</button></li>`).join('')}</ul></section>`;
}

/* ---------- render ---------- */
function render(){
  const me=PEOPLE[S.role];
  document.getElementById('meAvatar').textContent=me.short;
  document.getElementById('meName').textContent=me.name;
  document.getElementById('meRole').textContent=me.title;
  document.getElementById('mHello').textContent=`สวัสดี คุณ${me.greet}`;
  const nt=myTasks().todo.length, na=inbox(S.role).length;
  const tb=document.getElementById('navTaskBadge'), ab=document.getElementById('navApprBadge'), bb=document.getElementById('bellBadge');
  tb.textContent=nt;tb.hidden=!nt||!['STAFF','GROUP_HEAD'].includes(S.role);
  ab.textContent=na;ab.hidden=!na||!['GROUP_HEAD','DIRECTOR'].includes(S.role);
  bb.textContent=nt;bb.hidden=!nt;
  const navPage=S.page==='report'?(S.from||'activities'):S.page;
  document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===navPage?'page':'false'));
  view.innerHTML=({dashboard:vDashboard,activities:vActivities,report:vReport,mytasks:vMyTasks,approvals:vApprovals,dodont:vDoDont}[S.page])();
  bindView();
}

document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('roleSel').addEventListener('change',e=>{S.role=e.target.value;S.form=null;S.touched={};render();toast(`ดูในบทบาท ${PEOPLE[S.role].title}`)});
document.getElementById('bellBtn').addEventListener('click',()=>go('mytasks',{taskTab:'todo'}));

view.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  const fl=e.target.closest('[data-focus]');
  if(fl){e.preventDefault();const el=document.getElementById(fl.dataset.focus);el?.focus();el?.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(!t) return;
  const act=t.dataset.act;
  const openRep=(no,p)=>{const a=actById[no];p=+p||Math.max(...a.planned.filter(x=>x<CUR),0)||a.planned[0];go('report',{rep:{no,p},from:S.page==='report'?S.from:S.page})};
  switch(act){
    case 'open': e.preventDefault();e.stopPropagation();openRep(t.dataset.no,t.dataset.p);break;
    case 'open-row': openRep(t.dataset.no);break;
    case 'back': go(S.from||'activities');break;
    case 'export': toast('ส่งออกรายงานสรุปไปยัง Google Sheet แล้ว (ตัวอย่าง)','download');break;
    case 'report-now': {const f=myTasks().todo[0];if(f)openRep(f.a.no,f.p);break}
    case 'filter-group': S.f={q:'',st:'',owner:'',groups:new Set([+t.dataset.g])};go('activities');break;
    case 'toggle-group': {const g=+t.dataset.g;S.f.groups.has(g)?S.f.groups.delete(g):S.f.groups.add(g);render();break}
    case 'clear': S.f={q:'',st:'',owner:'',groups:new Set()};render();break;
    case 'tab': S.taskTab=t.dataset.k;render();break;
    case 'dd-g': S.dd.g=+t.dataset.g;render();break;
    case 'dd-r': S.dd.role=+t.dataset.r;render();break;
    case 'cancel': S.form=null;go(S.from||'mytasks');break;
    case 'save': saveDraft(false);break;
    case 'add-link': {const v=S.form,u=document.getElementById('f-link').value.trim();
      if(!/^https:\/\/(drive|docs)\.google\.com\//.test(u)){toast('ใส่ลิงก์ Google Drive ที่ขึ้นต้นด้วย https://drive.google.com หรือ docs.google.com','alert');break}
      v.evidence.push({kind:'LINK',name:u.replace(/^https:\/\//,'').slice(0,60),size:'ลิงก์',done:true});v.link='';S.dirty=true;render();break}
    case 'rm-file': S.form.evidence.splice(+t.dataset.i,1);S.dirty=true;render();break;
    case 'review': case 'approve': case 'return': decide(act);break;
  }
});

function bindView(){
  const fq=document.getElementById('fq');
  if(fq){fq.addEventListener('input',()=>{S.f.q=fq.value;const pos=fq.selectionStart;render();const n=document.getElementById('fq');n.focus();n.setSelectionRange(pos,pos)})}
  const fst=document.getElementById('fst');if(fst)fst.addEventListener('change',()=>{S.f.st=fst.value;render()});
  const fow=document.getElementById('fow');if(fow)fow.addEventListener('change',()=>{S.f.owner=fow.value;render()});
  const form=document.getElementById('repForm');
  if(form){
    const a=actById[S.rep.no],p=S.rep.p;
    const sync=(name,val,rerender)=>{S.form[name]=val;S.dirty=true;if(rerender){const id=document.activeElement?.id;render();if(id)document.getElementById(id)?.focus()}};
    form.addEventListener('input',e=>{const n=e.target.name;if(!n)return;
      if(n==='summary'){S.form.summary=e.target.value;S.dirty=true;const c=document.getElementById('sumCount');c.textContent=`${e.target.value.length.toLocaleString()}/1,000`;c.classList.toggle('over',e.target.value.length>1000);updateSubmit(a,p);return}
      if(n==='eta'){S.form.eta=e.target.value;S.dirty=true;const h=document.getElementById('etaBE');if(h)h.textContent=e.target.value?'= '+etaBE(e.target.value):'แสดงผลเป็น พ.ศ. หลังเลือกวันที่';updateSubmit(a,p);return}
      if(n==='progress'){S.touched.progress=true;sync(n,e.target.value,true);return}
      S.form[n]=e.target.value;S.dirty=true;updateSubmit(a,p)});
    // defer so a click on a button that took focus still fires before the form re-renders
    form.addEventListener('focusout',e=>{const n=e.target.name;if(!n||n==='progress'||!(n in FIELD_LABEL))return;S.touched[n]=true;
      setTimeout(()=>{if(S.page!=='report'||!document.getElementById('repForm'))return;const id=document.activeElement?.id;render();if(id)document.getElementById(id)?.focus()},180)});
    form.addEventListener('submit',e=>{e.preventDefault();
      const errs=validate(a,p,S.form);
      if(Object.keys(errs).length){Object.keys(FIELD_LABEL).forEach(k=>S.touched[k]=true);render();document.getElementById('errsum')?.focus();return}
      if(S.form.evidence.some(f=>!f.done)){toast('รอให้ไฟล์อัปโหลดเสร็จก่อนส่ง','alert');return}
      const r=persist('SUBMITTED');r.reporter=PEOPLE[S.role].name;r.submittedAt=new Date(NOW.getTime()+3600000);
      S.form=null;toast(`ส่งรายงาน ${a.no} รอบ ${pLabel(p)} ให้หัวหน้ากลุ่มงานตรวจแล้ว`,'send');render()});
    const fileIn=document.getElementById('f-file'), drop=document.getElementById('drop');
    const addFiles=files=>{[...files].forEach(f=>{
      const ext=f.name.split('.').pop().toLowerCase();
      if(!['pdf','docx','xlsx','pptx','jpg','png'].includes(ext)){toast(`ไม่รองรับไฟล์ .${ext} — ใช้ PDF, Word, Excel, PowerPoint, JPG หรือ PNG`,'alert');return}
      if(f.size>10*1024*1024){toast(`${f.name} ใหญ่เกิน 10 MB`,'alert');return}
      const item={kind:'FILE',name:f.name,size:f.size>1048576?`${(f.size/1048576).toFixed(1)} MB`:`${Math.max(1,Math.round(f.size/1024))} KB`,done:false};
      S.form.evidence.push(item);S.dirty=true;setTimeout(()=>{item.done=true;if(S.page==='report')render()},1200)});render()};
    fileIn.addEventListener('change',()=>addFiles(fileIn.files));
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
    drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files)});
  }
}
function updateSubmit(a,p){const b=document.querySelector('#repForm [type=submit]');if(b)b.setAttribute('aria-disabled',Object.keys(validate(a,p,S.form)).length?'true':'false')}
function persist(state){
  const a=actById[S.rep.no],p=S.rep.p,v=S.form,k=key(a.no,p);
  const prev=R[k]||{no:a.no,p,version:0};
  R[k]={...prev,actual:v.actual===''?'':+v.actual,progress:v.progress||'ON_PLAN',summary:v.summary,issues:v.issues,fix:v.fix,eta:v.eta,
    evidence:v.evidence.filter(f=>f.done).map(({done,...f})=>f),state,version:(prev.version||0)+1};
  if(state==='SUBMITTED'){delete R[k].reviewComment;delete R[k].reviewer;delete R[k].reviewedAt}
  return R[k];
}
function saveDraft(auto){
  if(S.page!=='report'||!S.form) return;
  const r=R[key(S.rep.no,S.rep.p)];
  persist(r?.state==='RETURNED'?'RETURNED':'DRAFT');S.dirty=false;S.lastSave=new Date();
  const n=document.getElementById('saveNote');if(n)n.textContent=`บันทึกร่างล่าสุด ${fmtT.format(S.lastSave)} น.`;
  toast(auto?`บันทึกร่างอัตโนมัติแล้ว · ${fmtT.format(S.lastSave)} น.`:'บันทึกร่างแล้ว','save');
}
setInterval(()=>{if(S.dirty)saveDraft(true)},30000);
function decide(act){
  const r=R[key(S.rep.no,S.rep.p)], c=document.getElementById('f-comment'), cm=c.value.trim(), who=PEOPLE[S.role].name, now=new Date(NOW.getTime()+3600000);
  if(act==='return'&&!cm){c.setAttribute('aria-invalid','true');c.setAttribute('aria-describedby','cmtErrMsg');
    document.getElementById('cmtErr').innerHTML=`<div class="ferr" id="cmtErrMsg">${ic('alert')}<span>ระบุเหตุผลที่ส่งกลับ เพื่อให้ผู้รายงานแก้ไขได้ถูกจุด</span></div>`;c.focus();return}
  if(act==='review'){r.state='REVIEWED';r.reviewer=who;r.reviewedAt=now;if(cm)r.reviewComment=cm;toast(`ผ่านการตรวจ ${r.no} แล้ว ส่งต่อผู้อำนวยการ`)}
  if(act==='approve'){r.state='APPROVED';r.approver=who;r.approvedAt=now;if(cm)r.approveComment=cm;toast(`อนุมัติ ${r.no} รอบ ${pLabel(r.p)} แล้ว · ผลถูกนับในตัวชี้วัด`,'shield')}
  if(act==='return'){r.state='RETURNED';r.reviewer=who;r.reviewedAt=now;r.reviewComment=cm;delete r.approver;delete r.approvedAt;toast(`ส่ง ${r.no} กลับให้ผู้รายงานแก้ไขแล้ว`,'undo')}
  r.version++;render();
}

/* ---------- boot ---------- */
hydrateIcons(document);
const h=(location.hash||'').slice(1);
if(['dashboard','activities','mytasks','approvals','dodont'].includes(h)) S.page=h;
else if(window.matchMedia('(max-width:480px)').matches) S.page='mytasks';
render();
</script>
