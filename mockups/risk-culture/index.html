<title>RAOT Risk Culture 2570</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: white sidebar 264px with RAOT logo + canvas of 12-col bento tiles (gap 24px); ≤960px → bottom nav */
:root{
  color-scheme:light;
  /* brand (sampled from RAOT logo) */
  --g-950:#002A16; --g-900:#003D20; --g-800:#01522C; --g-700:#016837; --g-600:#0B7A44;
  --g-200:#CFE6D9; --g-100:#E4F1EA; --g-50:#F2F8F5;
  --gold:#E49F22; --gold-700:#8A5300; --gold-50:#FDF3DF;
  /* neutrals, biased to brand green */
  --ink:#0B1F15; --ink-2:#34493E; --muted:#5A6E63; --hair:#E2E9E5; --hair-2:#EEF3F0;
  --canvas:#F4F7F5; --surface:#FFFFFF; --field:#FBFCFB;
  /* status */
  --done:#016837; --done-bg:#E4F1EA; --done-fg:#01522C;
  --ok:#62B98A;   --ok-bg:#EAF6EF;   --ok-fg:#13633B;
  --late:#E49F22; --late-bg:#FDF3DF; --late-fg:#7A4A00; --late-ring:#C27C0E;
  --risk:#C2410C; --risk-bg:#FCE8DF; --risk-fg:#9A2B06;
  --na:#C9D4CE;   --na-bg:#EEF2F0;   --na-fg:#4A5E53;
  --info-bg:#E8EEF8; --info-fg:#1E4A85;
  --error:#B42318; --error-bg:#FEF1EE;
  --disabled:#B5CABE; --white:#FFFFFF;
  /* shape */
  --r-tile:22px; --r-md:14px; --r-sm:10px; --r-full:999px;
  --shadow:0 1px 2px rgba(0,42,22,.04),0 12px 32px -16px rgba(0,42,22,.16);
  --shadow-lift:0 2px 4px rgba(0,42,22,.05),0 18px 40px -18px rgba(0,42,22,.24);
  --gap:24px;
  /* type */
  --display:'Anuphan','IBM Plex Sans Thai','Leelawadee UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Thai','Anuphan','Leelawadee UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.65;color:var(--ink);background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.005em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--g-700);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* mock strip */
.mockbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;background:var(--g-950);color:rgba(255,255,255,.86);font-size:12.5px;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mockbar b{color:var(--gold);font-weight:600;letter-spacing:.04em}
.rolesw{display:flex;gap:4px;padding:3px;border-radius:var(--r-full);background:rgba(255,255,255,.1)}
.rolesw button{border:0;background:none;color:rgba(255,255,255,.8);padding:3px 12px;border-radius:var(--r-full);cursor:pointer;font-size:12.5px;min-height:26px}
.rolesw button[aria-pressed="true"]{background:var(--white);color:var(--g-800);font-weight:600}

/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:calc(100vh - 38px);background:linear-gradient(90deg,var(--surface) 263px,var(--hair) 263px 264px,transparent 264px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:28px 18px 20px;gap:28px}
.side .logo{display:block;width:176px;height:auto;margin:0 8px}
.side .sys{margin:-14px 8px 0;padding-top:14px;border-top:1px solid var(--hair-2);font-size:12px;color:var(--muted);line-height:1.5}
.side .sys b{display:block;color:var(--ink);font-family:var(--display);font-size:14px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 12px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:12px;background:none;cursor:pointer;text-align:left;color:var(--ink-2);font-weight:500;transition:background .15s ease-out,color .15s ease-out}
.nav button:hover{background:var(--g-50);color:var(--g-800)}
.nav button[aria-current="page"]{background:var(--g-700);color:var(--white);box-shadow:0 8px 18px -10px rgba(1,104,55,.7)}
.nav .badge{margin-left:auto}
.me{margin-top:auto;display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);background:var(--g-50);border:1px solid var(--hair-2)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--g-700);color:var(--white);display:grid;place-items:center;font-weight:600;font-family:var(--display);flex:none}
.me b{display:block;font-size:13.5px;line-height:1.35}
.me span{font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:36px 40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);width:100%}
.mtop,.bottomnav{display:none}

/* page header */
.ph{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--g-700);font-weight:600;margin:0 0 6px}
.ph h1{font-size:32px;line-height:1.25;margin:0;font-weight:700}
.ph p.sub{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.ph-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--g-700);background:none;border:0;padding:4px 0;cursor:pointer;font-weight:600;align-self:flex-start}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 18px;border-radius:12px;border:1px solid var(--hair);background:var(--surface);cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap;transition:background .15s ease-out,border-color .15s ease-out,box-shadow .15s ease-out,transform .15s ease-out}
.btn:hover{border-color:var(--g-200);background:var(--g-50)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--g-700);border-color:var(--g-700);color:var(--white);box-shadow:0 10px 20px -12px rgba(1,104,55,.8)}
.btn.primary:hover{background:var(--g-800);border-color:var(--g-800)}
.btn.danger{color:var(--risk-fg);border-color:#F2C9B8}
.btn.danger:hover{background:var(--risk-bg)}
.btn[aria-disabled="true"]{background:var(--disabled);border-color:var(--disabled);color:var(--white);box-shadow:none;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.field>.lbl{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req{font-size:12px;font-weight:500;color:var(--error)}
.opt{font-size:12px;font-weight:400;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.input{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--hair);background:var(--field);transition:border-color .15s ease-out,box-shadow .15s ease-out}
textarea.input{min-height:104px;resize:vertical;line-height:1.6}
.input:hover{border-color:#C8D6CE}
.input:focus{border-color:var(--g-700);box-shadow:0 0 0 4px var(--g-100);outline:none}
.input[readonly]{background:var(--hair-2);color:var(--ink-2)}
.input[aria-invalid="true"]{border-color:var(--error);background:var(--error-bg)}
.ferr{display:flex;gap:6px;align-items:flex-start;color:var(--error);font-size:13px;font-weight:500}
.ferr svg.i{width:16px;height:16px;margin-top:3px}
.suffix{display:flex}
.suffix .input{border-radius:12px 0 0 12px}
.suffix span{display:flex;align-items:center;padding:0 14px;border:1px solid var(--hair);border-left:0;border-radius:0 12px 12px 0;background:var(--hair-2);font-size:14px;color:var(--ink-2);white-space:nowrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:var(--r-full);font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.st-DONE{background:var(--done-bg);color:var(--done-fg)}
.st-ON_TRACK{background:var(--ok-bg);color:var(--ok-fg)}
.st-LATE{background:var(--late-bg);color:var(--late-fg)}
.st-BELOW_TARGET{background:var(--risk-bg);color:var(--risk-fg)}
.st-NOT_DUE{background:var(--na-bg);color:var(--na-fg)}
.wf-DRAFT{background:var(--na-bg);color:var(--na-fg)}
.wf-SUBMITTED{background:var(--info-bg);color:var(--info-fg)}
.wf-APPROVED{background:var(--done-bg);color:var(--done-fg)}
.wf-RETURNED,.wf-NONE{background:var(--late-bg);color:var(--late-fg)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:var(--r-full);background:var(--gold);color:var(--g-950);font-size:12px;font-weight:700;font-family:var(--display)}
.c-DONE{background:var(--done)}.c-ON_TRACK{background:var(--ok)}.c-LATE{background:var(--late)}.c-BELOW_TARGET{background:var(--risk)}.c-NOT_DUE{background:var(--na)}

/* tiles & bento */
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-tile);box-shadow:var(--shadow);padding:28px;min-width:0}
.tile-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.tile-head h2{font-size:19px;margin:0;font-weight:600}
.tile-head p{margin:0;font-size:13px;color:var(--muted)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s8{grid-column:span 8}

.hero{position:relative;overflow:hidden;color:var(--white);border:0;padding:32px;display:flex;flex-direction:column;gap:28px;justify-content:space-between;
  background:radial-gradient(520px 300px at 100% 0%,rgba(228,159,34,.20),transparent 60%),radial-gradient(700px 420px at -10% 120%,rgba(98,185,138,.28),transparent 60%),linear-gradient(150deg,var(--g-700),var(--g-900) 70%)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(255,255,255,.05);pointer-events:none}
.hero .eyebrow{color:var(--gold)}
.hero h2{margin:0;font-size:24px;line-height:1.35;font-weight:600;max-width:26ch}
.hero-main{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .v b{font-size:38px;font-weight:700}
.ring .v span{font-size:12px;opacity:.8;margin-top:4px}
.hero-facts{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:16px 40px}
.hero-facts div{display:flex;flex-direction:column}
.hero-facts b{font-size:28px;font-weight:600;line-height:1.2}
.hero-facts span{font-size:13px;color:rgba(255,255,255,.75)}
.stack{display:flex;height:12px;border-radius:var(--r-full);overflow:hidden;gap:3px}
.stack i{display:block;height:100%;border-radius:3px}
.hero .stack{background:rgba(255,255,255,.1)}
.hero .c-ON_TRACK{background:#8FD3AE}.hero .c-DONE{background:var(--white)}.hero .c-NOT_DUE{background:rgba(255,255,255,.28)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{font-family:var(--display);font-weight:600}
.hero .legend{color:rgba(255,255,255,.85)}
.hero .legend b{color:var(--white)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.kpi{display:flex;flex-direction:column;gap:6px;padding:24px}
.kpi .k{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);font-weight:500}
.kpi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--g-50);color:var(--g-700);flex:none}
.kpi .ico.warn{background:var(--late-bg);color:var(--late-fg)}
.kpi .v{font-family:var(--display);font-size:40px;font-weight:700;line-height:1.1;margin-top:12px}
.kpi .v small{font-size:20px;font-weight:500;color:var(--muted)}
.kpi .s{font-size:13px;color:var(--ink-2)}
.bar{height:8px;border-radius:var(--r-full);background:var(--hair-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--g-700);border-radius:inherit}

/* RUBBER */
.values{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.vcard{text-align:left;cursor:pointer;padding:20px 18px;display:flex;flex-direction:column;gap:12px;border-radius:18px;border:1px solid var(--hair);background:linear-gradient(180deg,var(--g-50),var(--surface) 70%);transition:transform .2s ease-out,box-shadow .2s ease-out,border-color .2s ease-out}
.vcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--g-200)}
.vletter{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;color:var(--g-700)}
.vcard b{display:block;font-size:15px;line-height:1.35;font-family:var(--display);font-weight:600}
.vcard .dim{font-size:12px;color:var(--muted)}
.mini{display:flex;gap:4px}
.mini i{flex:1;height:6px;border-radius:3px}
.vcard p{margin:0;font-size:12.5px;color:var(--ink-2);margin-top:auto}

/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li+li{border-top:1px solid var(--hair-2)}
.list button{width:100%;display:flex;gap:14px;align-items:center;padding:14px 8px;background:none;border:0;cursor:pointer;text-align:left;border-radius:12px;transition:background .15s ease-out}
.list button:hover{background:var(--g-50)}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-weight:500;font-size:14.5px;line-height:1.45}
.list .t span{font-size:12.5px;color:var(--muted)}
.idtag{font-family:var(--display);font-weight:700;font-size:14px;color:var(--g-700);width:40px;height:40px;border-radius:12px;background:var(--g-50);display:grid;place-items:center;flex:none}
.list svg.i{color:var(--muted)}

/* month chart */
.mchart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end}
.mcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mbars{position:relative;height:140px;width:100%;display:flex;justify-content:center;align-items:flex-end}
.mbars .due{position:absolute;bottom:0;width:min(22px,70%);border-radius:7px 7px 3px 3px;background:var(--hair-2);border:1px dashed #C8D6CE}
.mbars .ontime{position:relative;width:min(22px,70%);border-radius:7px 7px 3px 3px;background:var(--g-700)}
.mcol .lab{font-size:11px;color:var(--muted)}
.mcol .val{font-size:11px;color:var(--ink-2);font-family:var(--display);height:16px}
.mcol.cur .lab{color:var(--gold-700);font-weight:700}
.mcol.cur .due{border-color:var(--gold);border-style:solid;background:var(--gold-50)}
.nextbar{display:flex;gap:12px;align-items:center;margin-top:22px;padding:14px 16px;border-radius:var(--r-md);background:var(--gold-50);color:var(--gold-700);font-size:14px}

/* filters + table */
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.filters .field{flex:1 1 200px}
.filters .search{flex:2 1 300px;position:relative}
.filters .search svg.i{position:absolute;left:14px;bottom:14px;color:var(--muted)}
.filters .search .input{padding-left:42px}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex-basis:100%}
.fchip{min-height:36px;padding:5px 16px;border-radius:var(--r-full);border:1px solid var(--hair);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;gap:8px;align-items:center;transition:background .15s ease-out}
.fchip:hover{background:var(--g-50)}
.fchip[aria-pressed="true"]{background:var(--g-700);border-color:var(--g-700);color:var(--white)}
.fchip .L{font-family:var(--display);font-weight:700}
.tablewrap{overflow-x:auto}
table.acts{width:100%;border-collapse:collapse;min-width:1100px;font-size:14px}
.acts th{font-size:11.5px;letter-spacing:.06em;font-weight:600;color:var(--muted);text-align:left;padding:0 12px 14px;border-bottom:1px solid var(--hair);white-space:nowrap}
.acts td{padding:16px 12px;border-bottom:1px solid var(--hair-2);vertical-align:top}
.acts tr.grp td{padding:22px 12px 10px;border-bottom:1px solid var(--hair)}
.grp-h{display:flex;gap:12px;align-items:center}
.grp-h .L{width:32px;height:32px;border-radius:10px;background:var(--g-700);color:var(--white);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.grp-h b{font-family:var(--display);font-weight:600;font-size:15px}
.grp-h span{color:var(--muted);font-size:13px}
.acts tr.arow{cursor:pointer;transition:background .15s ease-out}
.acts tr.arow:hover{background:var(--g-50)}
.acts .no{font-family:var(--display);font-weight:700;color:var(--g-700)}
.acts .nm a{font-weight:600;color:var(--ink);text-decoration:none}
.acts .nm a:hover{color:var(--g-700);text-decoration:underline}
.acts .sub{font-size:12px;color:var(--muted);margin-top:3px}
.acts .kpi-t{color:var(--ink-2);max-width:250px}
.prog{min-width:130px}
.prog .bar{height:6px;margin-top:6px}
.cal,.cal-h{display:grid;grid-template-columns:repeat(12,16px);gap:4px}
.cal-h{font-size:10px;color:var(--muted);text-align:center;font-weight:500;letter-spacing:0}
.cal i{width:16px;height:16px;border-radius:5px;display:block;position:relative}
.cal .sent{background:var(--g-700)}
.cal .due{background:var(--late-bg);border:2px solid var(--late-ring)}
.cal .future{border:1.5px solid var(--ok);background:var(--surface)}
.cal .none::after{content:"";position:absolute;left:4px;right:4px;top:7px;height:2px;border-radius:2px;background:var(--na)}
.cal .cur{outline:2px solid var(--gold);outline-offset:1px}
.callegend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;color:var(--ink-2);padding-top:18px}
.callegend span{display:inline-flex;gap:8px;align-items:center}
.empty{padding:56px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--ink-2)}
.empty b{font-family:var(--display);font-size:18px;color:var(--ink)}
.empty svg.i{width:28px;height:28px;color:var(--g-700)}

/* report */
.rhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.rhead-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.vbadge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--g-700);color:var(--white);font-weight:700;font-family:var(--display)}
.rhead h1{margin:0 0 8px;font-size:26px;line-height:1.35}
.rhead .meta{font-size:14px;color:var(--muted)}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:12px}
.sum3>div{padding:14px 16px;border-radius:var(--r-md);background:var(--g-50);border:1px solid var(--hair-2)}
.sum3 span{display:block;font-size:12px;color:var(--muted)}
.sum3 b{font-family:var(--display);font-size:26px;font-weight:700}
.sum3 small{font-size:13px;color:var(--muted);font-weight:500}
.sum3 .bar{margin-top:6px;height:6px}
.rlayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--gap);align-items:start}
.form{display:flex;flex-direction:column;gap:24px}
.form h2{font-size:20px;margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.radios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border:0;padding:0;margin:0}
.radios legend{font-weight:600;font-size:14px;margin-bottom:8px;padding:0;display:flex;gap:8px;align-items:center}
.rcard{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-md);border:1px solid var(--hair);background:var(--field);cursor:pointer;min-height:44px;transition:border-color .15s ease-out,background .15s ease-out}
.rcard:hover{border-color:var(--g-200)}
.rcard input{margin:4px 0 0;accent-color:var(--g-700);width:17px;height:17px;flex:none}
.rcard b{display:block;font-size:14px;line-height:1.4}
.rcard span{font-size:12px;color:var(--muted)}
.rcard:has(input:checked){border-color:var(--g-700);background:var(--g-50);box-shadow:inset 0 0 0 1px var(--g-700)}
.rcard:has(input:focus-visible){outline:2px solid var(--g-700);outline-offset:2px}
.counter{font-size:12px;color:var(--muted);white-space:nowrap}
.counter.over{color:var(--error);font-weight:600}
.errsum{border:1px solid #F4C7BE;background:var(--error-bg);border-radius:var(--r-md);padding:16px 18px;color:var(--error)}
.errsum b{display:flex;gap:8px;align-items:center}
.errsum ul{margin:6px 0 0;padding-left:22px}
.errsum a{color:var(--error);font-weight:500}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px;border:1.5px dashed #B6D3C3;border-radius:var(--r-md);background:var(--g-50);text-align:center;cursor:pointer;color:var(--ink-2);font-size:14px;transition:background .15s ease-out,border-color .15s ease-out}
.drop:hover,.drop.over{background:var(--g-100);border-color:var(--g-700)}
.drop .ico{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--g-700);box-shadow:var(--shadow)}
.drop b{color:var(--g-700)}
.drop:has(input:focus-visible){outline:2px solid var(--g-700);outline-offset:2px}
.linkrow{display:flex;gap:10px}
.linkrow .input{flex:1;min-width:0}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.files li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--hair);font-size:14px}
.files li>svg.i{color:var(--g-700)}
.files .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fs{font-size:12px;color:var(--muted);white-space:nowrap}
.files .ok{color:var(--done-fg);font-size:12px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.files .ok svg.i{width:14px;height:14px}
.files .up{color:var(--info-fg);font-size:12px;white-space:nowrap}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--hair-2);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center;padding-top:20px;border-top:1px solid var(--hair-2)}
.actions .note{margin-right:auto;font-size:13px;color:var(--muted)}
.ro{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px 20px;margin:0;font-size:14.5px}
.ro dt{color:var(--muted)}
.ro dd{margin:0;white-space:pre-line}
.decision{padding:20px;border-radius:var(--r-md);background:var(--g-50);border:1px solid var(--g-200);display:flex;flex-direction:column;gap:14px}
.decision>b{font-family:var(--display);font-size:16px;color:var(--g-800)}
.aside{display:flex;flex-direction:column;gap:var(--gap)}
.aside .tile{padding:24px}
.aside h3{margin:0 0 16px;font-size:16px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;position:relative;padding-bottom:20px}
.steps li:last-child{padding-bottom:0}
.steps li:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:4px;width:2px;background:var(--hair)}
.steps li.done:not(:last-child)::before{background:var(--g-700)}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--display);background:var(--hair-2);color:var(--muted);border:2px solid transparent}
.dot svg.i{width:16px;height:16px}
.steps .done .dot{background:var(--g-700);color:var(--white)}
.steps .cur .dot{background:var(--surface);border-color:var(--g-700);color:var(--g-700)}
.steps .ret .dot{background:var(--late-bg);color:var(--late-fg);border-color:var(--late-ring)}
.steps b{display:block;font-size:14px;line-height:1.4}
.steps span{font-size:12.5px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0}
.hist li+li{border-top:1px solid var(--hair-2)}
.hist button{width:100%;display:flex;gap:10px;align-items:center;padding:10px 8px;border:0;background:none;cursor:pointer;text-align:left;font-size:14px;border-radius:10px}
.hist button:hover{background:var(--g-50)}
.hist button[aria-current="true"]{font-weight:600;background:var(--g-50);box-shadow:inset 3px 0 0 var(--g-700)}
.hist .m{width:82px;flex:none}
.hist .v{margin-left:auto;font-size:13px;color:var(--ink-2)}
.comment{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--late-bg);color:var(--late-fg);font-size:13.5px}
.comment.info{background:var(--info-bg);color:var(--info-fg)}
details.dd{border-top:1px solid var(--hair-2)}
details.dd:first-of-type{border-top:0}
details.dd summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px}
details.dd .lists{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;font-size:13px}
.dolist{margin:0;padding:10px 14px 10px 32px;border-radius:12px}
.dolist.do{background:var(--done-bg);color:var(--done-fg)}
.dolist.dont{background:var(--risk-bg);color:var(--risk-fg)}
.dohead{font-weight:600;display:flex;gap:6px;align-items:center;font-size:13px}

/* my tasks */
.hello{color:var(--white);border:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:center;
  background:radial-gradient(400px 220px at 100% 0%,rgba(228,159,34,.22),transparent 60%),linear-gradient(140deg,var(--g-700),var(--g-900))}
.hello .eyebrow{color:var(--gold);margin:0}
.hello h2{margin:4px 0 4px;font-size:24px;font-weight:600}
.hello p{margin:0;font-size:14px;color:rgba(255,255,255,.8)}
.hello .big{text-align:right}
.hello .big b{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.hello .big span{display:block;font-size:13px;color:rgba(255,255,255,.75)}
.hello .bar{grid-column:1/-1;background:rgba(255,255,255,.18)}
.hello .bar>i{background:var(--gold)}
.seg{display:flex;padding:5px;border-radius:16px;background:var(--surface);border:1px solid var(--hair);gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;min-height:42px;border:0;border-radius:12px;background:none;cursor:pointer;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;justify-content:center;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--g-700);color:var(--white)}
.tasks{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.task{display:flex;flex-direction:column;gap:12px;padding:24px}
.task-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.task-id{display:flex;gap:10px;align-items:center;font-weight:600;font-size:13px;color:var(--muted)}
.task-id .idtag{width:36px;height:36px;font-size:13px}
.task h3{margin:0;font-size:16px;line-height:1.45;font-weight:600}
.task .meta{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.task .meta span{display:inline-flex;gap:8px;align-items:center}
.task .meta svg.i{width:15px;height:15px;color:var(--muted)}
.task .btn{min-height:46px;width:100%;margin-top:auto}
.overdue{color:var(--late-fg)!important;font-weight:600}

/* do & don't */
.ddgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.ddcol h3{margin:0 0 14px;font-size:18px;display:flex;gap:10px;align-items:center}
.ddcol ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.ddcol.do h3{color:var(--done-fg)}
.ddcol.dont h3{color:var(--risk-fg)}
.ddcol .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.ddcol.do .ico{background:var(--done-bg)}
.ddcol.dont .ico{background:var(--risk-bg)}

/* settings */
.utable{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.utable th{font-size:11.5px;letter-spacing:.06em;color:var(--muted);text-align:left;padding:0 12px 10px;border-bottom:1px solid var(--hair);font-weight:600}
.utable td{padding:14px 12px;border-bottom:1px solid var(--hair-2)}
.ucell{display:flex;gap:10px;align-items:center}
.ucell .avatar{width:34px;height:34px;font-size:12px}
.role{font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--r-full);white-space:nowrap}
.role.ADMIN{background:var(--gold-50);color:var(--gold-700)}
.role.REPORTER{background:var(--g-50);color:var(--g-800)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;margin:0}
.kv dt,.kv dd{padding:12px 0;border-bottom:1px solid var(--hair-2);margin:0;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{font-family:var(--display);font-weight:600;text-align:right;padding-left:12px}

/* toast */
.toasts{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;padding:13px 18px;border-radius:14px;background:var(--g-950);color:var(--white);box-shadow:var(--shadow-lift);font-size:14px;max-width:380px;animation:tin .2s ease-out}
.toast svg.i{color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--hair)}
.foot img{height:26px;width:auto}

@media (max-width:1280px){.values{grid-template-columns:repeat(3,minmax(0,1fr))}}

}

    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));

  .bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center;border:0;background:none;font-size:11.5px;color:var(--muted);cursor:pointer;border-radius:14px;font-weight:600;position:relative}

  .ph h1{font-size:26px}
  .tile{padding:20px}
  .hero{padding:24px}
}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

  .sum3>div{padding:10px}
  .sum3 b{font-size:19px}
  .ro{grid-template-columns:minmax(0,1fr);gap:2px}
  .ro dd{margin-bottom:12px}
  .actions .btn{flex:1 1 auto;min-height:46px}

}

const SENT=['SUBMITTED','APPROVED'];
const STATUS={DONE:{t:'เสร็จสิ้น',s:'✓'},ON_TRACK:{t:'ตามแผน',s:'●'},LATE:{t:'ล่าช้า',s:'!'},BELOW_TARGET:{t:'ต่ำกว่าเป้า',s:'▼'},NOT_DUE:{t:'ยังไม่ถึงกำหนด',s:'○'}};
const ORDER=['DONE','ON_TRACK','LATE','BELOW_TARGET','NOT_DUE'];
const WF={NONE:'ยังไม่รายงาน',DRAFT:'ร่าง',SUBMITTED:'รอผู้ดูแลระบบตรวจ',APPROVED:'อนุมัติแล้ว',RETURNED:'ส่งกลับแก้ไข'};
const reportsOf=no=>Object.values(R).filter(r=>r.no===no).sort((a,b)=>a.p-b.p);
const latestApproved=no=>reportsOf(no).filter(r=>r.state==='APPROVED').pop();
function compute(a){
  const rep=p=>R[key(a.no,p)];
  const overdue=a.planned.filter(p=>dueDate(p)<NOW&&!(rep(p)&&SENT.includes(rep(p).state)));
  const latestSent=reportsOf(a.no).filter(r=>SENT.includes(r.state)).pop();
  const ap=latestApproved(a.no), val=ap?ap.actual:null, last=Math.max(...a.planned);
  const progress=val==null?0:Math.min(val/a.target,1);
  let st;
  if(overdue.length||(latestSent&&latestSent.progress==='DELAYED')) st='LATE';
  else if(dueDate(last)<NOW&&(val==null||val<a.target)) st='BELOW_TARGET';
  else if(val!=null&&val>=a.target&&rep(last)?.state==='APPROVED') st='DONE';
  else if(Math.min(...a.planned)>CUR) st='NOT_DUE';
  else st='ON_TRACK';
  return {st,val,progress,overdue,ap};
}

function myTasks(){
  const todo=[],wait=[],done=[];
  A.forEach(a=>a.planned.forEach(p=>{
    if(p>CUR) return;
    const r=R[key(a.no,p)];
    if(!r||r.state==='DRAFT'||r.state==='RETURNED') todo.push({a,p,r});
    else if(r.state==='SUBMITTED') wait.push({a,p,r});
    else if(p>=CUR-1) done.push({a,p,r});
  }));
  todo.sort((x,y)=>x.p-y.p);
  return {todo,wait,done};
}

/* ---------- activities ---------- */
function calCell(a,p){
  const r=R[key(a.no,p)];let c,t;
  if(a.plan[p-1]!=='1'){c='none';t='ไม่มีแผน'}
  else if(r&&SENT.includes(r.state)){c='sent';t='ส่งแล้ว'}
  else if(p<CUR){c='due';t='ถึงรอบแต่ยังไม่ส่ง'}
  else{c='future';t='แผนอนาคต'}
  return `<i class="${c}${p===CUR?' cur':''}" title="${MON[p-1]}: ${t}"><span class="sr-only">${MON[p-1]} ${t}</span></i>`;
}
const legendCell=c=>`<span class="cal" style="grid-template-columns:16px"><i class="${c}"></i></span>`;

/* ---------- report ---------- */
const canEdit=r=>!r||['DRAFT','RETURNED'].includes(r.state);
function formVals(r){
  if(!S.form) S.form={actual:r?.actual??'',progress:r?.progress||'',summary:r?.summary||'',issues:r?.issues||'',fix:r?.fix||'',eta:r?.eta||'',evidence:(r?.evidence||[]).map(e=>({...e,done:true})),link:''};
  return S.form;
}
const prevApproved=(a,p)=>reportsOf(a.no).filter(r=>r.p<p&&r.state==='APPROVED').pop();
function validate(a,p,v){
  const e={};
  if(v.actual===''||v.actual==null) e.actual='กรอกผลการดำเนินงาน';
  else if(isNaN(+v.actual)||+v.actual<0) e.actual='ผลต้องเป็นตัวเลขไม่ติดลบ';
  else if(a.unit==='ร้อยละ'&&+v.actual>100) e.actual='ค่าร้อยละต้องไม่เกิน 100';
  else if(a.type==='COUNT_CUMULATIVE'){const pr=prevApproved(a,p);if(pr&&+v.actual<pr.actual)e.actual=`ยอดสะสมต้องไม่น้อยกว่ารอบก่อน (${pr.actual} ${a.unit})`}
  if(!v.progress) e.progress='เลือกสถานะการดำเนินงาน';
  if(!v.summary.trim()) e.summary='กรอกสรุปผลการดำเนินงาน';
  else if(v.summary.length>1000) e.summary='สรุปผลยาวเกิน 1,000 ตัวอักษร';
  if((v.progress==='DELAYED'||v.progress==='NOT_STARTED')&&!v.issues.trim()) e.issues='ระบุปัญหา/อุปสรรค เมื่อสถานะล่าช้าหรือยังไม่เริ่ม';
  if(v.progress==='DELAYED'&&!v.eta) e.eta='ระบุวันที่คาดว่าจะแล้วเสร็จ';
  return e;
}
const FIELD_LABEL={actual:'ผลการดำเนินงาน',progress:'สถานะการดำเนินงาน',summary:'สรุปผล',issues:'ปัญหา/อุปสรรค',eta:'วันที่คาดว่าเสร็จ'};
const errHtml=(id,e)=>e&&S.touched[id]?`<div class="ferr" id="${id}-err">${ic('alert')}<span>${esc(e)}</span></div>`:'';
const inv=(id,e)=>e&&S.touched[id]?` aria-invalid="true" aria-describedby="${id}-err"`:'';
function etaBE(v){if(!v)return '';const [y,m,d]=v.split('-').map(Number);return fd(new Date(y,m-1,d))}
const PROG={ON_PLAN:'เป็นไปตามแผน',DELAYED:'ล่าช้ากว่าแผน',NOT_STARTED:'ยังไม่เริ่มดำเนินการ'};

      ${errs.length?`<div class="errsum" role="alert" tabindex="-1" id="errsum"><b>${ic('alert')}ยังส่งไม่ได้ ต้องแก้ไข ${errs.length} รายการ</b><ul>${errs.map(k=>`<li><a href="#f-${k}" data-focus="f-${k}">${FIELD_LABEL[k]}: ${esc(e[k])}</a></li>`).join('')}</ul></div>`:''}

          ${errHtml('actual',e.actual)||`<span class="hint">${pr?`รอบก่อนที่อนุมัติ (${pLabel(pr.p)}): ${fmtVal(a,pr.actual)}${esc(unitTail(a))}`:'ยังไม่มีผลที่อนุมัติ'} · เป้า ${fmtVal(a,a.target)}${esc(unitTail(a))}</span>`}</div>

          <input type="file" id="f-file" class="sr-only" multiple accept=".pdf,.docx,.xlsx,.pptx,.jpg,.png"></label>

        ${v.evidence.length?`<ul class="files">${v.evidence.map((f,i)=>`<li>${ic(f.kind==='LINK'?'link':'file')}<span class="fn">${esc(f.name)}</span><span class="fs">${esc(f.size)}</span>

  } else {

/* ---------- render ---------- */
const VIEWS={dashboard:vDashboard,activities:vActivities,report:vReport,mytasks:vMyTasks,approvals:vApprovals,settings:vSettings,dodont:vDoDont};
function render(){
  const me=PEOPLE[S.role];
  document.getElementById('meAvatar').textContent=me.short;
  document.getElementById('meName').textContent=me.name;
  document.getElementById('meRole').textContent=me.title;

  document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
  document.querySelectorAll('[data-only]').forEach(b=>b.hidden=b.dataset.only!==S.role);
  const nt=myTasks().todo.length, na=inbox().length;
  [['navTaskBadge',nt],['bnTask',nt],['navApprBadge',na],['bnAppr',na]].forEach(([id,n])=>{const el=document.getElementById(id);el.textContent=n;el.hidden=!n});
  const bb=document.getElementById('bellBadge'), bn=S.role==='ADMIN'?na:nt;bb.textContent=bn;bb.hidden=!bn;

/* ---------- events ---------- */
document.querySelectorAll('.nav [data-page],.bottomnav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{
  S.role=b.dataset.role;S.form=null;S.touched={};
  if((S.role==='ADMIN'&&S.page==='mytasks')||(S.role==='REPORTER'&&['approvals','settings'].includes(S.page))) S.page='dashboard';
  render();toast(`ดูในบทบาท${S.role==='ADMIN'?'ผู้ดูแลระบบ':'ผู้รายงาน'}`)}));
document.getElementById('bellBtn').addEventListener('click',()=>go(S.role==='ADMIN'?'approvals':'mytasks',{taskTab:'todo'}));

view.addEventListener('click',e=>{
  const fl=e.target.closest('[data-focus]');
  if(fl){e.preventDefault();const el=document.getElementById(fl.dataset.focus);el?.focus();el?.scrollIntoView({block:'center',behavior:'smooth'});return}
  const t=e.target.closest('[data-act]');if(!t) return;
  const openRep=(no,p)=>{const a=actById[no];p=+p||Math.max(...a.planned.filter(x=>x<CUR),0)||a.planned[0];go('report',{rep:{no,p},from:S.page==='report'?S.from:S.page})};
  switch(t.dataset.act){
    case 'open': e.preventDefault();e.stopPropagation();openRep(t.dataset.no,t.dataset.p);break;
    case 'open-row': openRep(t.dataset.no);break;
    case 'nav': go(t.dataset.page);break;
    case 'back': go(S.from||'activities');break;
    case 'export': toast('ส่งออกรายงานสรุปไปยัง Google Sheet แล้ว (ตัวอย่าง)','download');break;
    case 'mock': toast('ตัวอย่าง: เปิดฟอร์มเพิ่มผู้ใช้ (เลือกบทบาทผู้ดูแลระบบหรือผู้รายงาน)','pen');break;
    case 'report-now': {const f=myTasks().todo[0];if(f)openRep(f.a.no,f.p);break}
    case 'filter-group': S.f={q:'',st:'',owner:'',groups:new Set([+t.dataset.g])};go('activities');break;
    case 'toggle-group': {const g=+t.dataset.g;S.f.groups.has(g)?S.f.groups.delete(g):S.f.groups.add(g);render();break}
    case 'clear': S.f={q:'',st:'',owner:'',groups:new Set()};render();break;
    case 'tab': S.taskTab=t.dataset.k;render();break;
    case 'dd-g': S.dd.g=+t.dataset.g;render();break;
    case 'dd-r': S.dd.role=+t.dataset.r;render();break;
    case 'cancel': S.form=null;go(S.from||'dashboard');break;
    case 'save': saveDraft(false);break;
    case 'add-link': {const u=document.getElementById('f-link').value.trim();
      if(!/^https:\/\/(drive|docs)\.google\.com\//.test(u)){toast('ใส่ลิงก์ที่ขึ้นต้นด้วย https://drive.google.com หรือ https://docs.google.com','alert');break}
      S.form.evidence.push({kind:'LINK',name:u.replace(/^https:\/\//,'').slice(0,60),size:'ลิงก์',done:true});S.form.link='';S.dirty=true;render();break}
    case 'rm-file': S.form.evidence.splice(+t.dataset.i,1);S.dirty=true;render();break;
    case 'approve': case 'return': case 'reopen': decide(t.dataset.act);break;
  }
});

function bindView(){
  const fq=document.getElementById('fq');
  if(fq) fq.addEventListener('input',()=>{S.f.q=fq.value;const pos=fq.selectionStart;render();const n=document.getElementById('fq');n.focus();n.setSelectionRange(pos,pos)});
  const fst=document.getElementById('fst');if(fst) fst.addEventListener('change',()=>{S.f.st=fst.value;render()});
  const fow=document.getElementById('fow');if(fow) fow.addEventListener('change',()=>{S.f.owner=fow.value;render()});
  const form=document.getElementById('repForm');if(!form) return;
  const a=actById[S.rep.no],p=S.rep.p;
  form.addEventListener('input',e=>{const n=e.target.name;if(!n)return;S.form[n]=e.target.value;S.dirty=true;
    if(n==='summary'){const c=document.getElementById('sumCount');c.textContent=`${e.target.value.length.toLocaleString()}/1,000`;c.classList.toggle('over',e.target.value.length>1000)}
    if(n==='eta'){const h=document.getElementById('etaBE');if(h)h.textContent=e.target.value?'= '+etaBE(e.target.value):'แสดงผลเป็น พ.ศ. หลังเลือกวันที่'}
    if(n==='progress'){S.touched.progress=true;render();document.querySelector(`input[name=progress][value=${e.target.value}]`)?.focus();return}
    updateSubmit(a,p)});
  // defer so a click on a button that took focus still fires before the form re-renders
  form.addEventListener('focusout',e=>{const n=e.target.name;if(!n||!(n in FIELD_LABEL)||n==='progress')return;S.touched[n]=true;
    setTimeout(()=>{if(S.page!=='report'||!document.getElementById('repForm'))return;const id=document.activeElement?.id;render();if(id)document.getElementById(id)?.focus()},180)});
  form.addEventListener('submit',e=>{e.preventDefault();
    if(Object.keys(validate(a,p,S.form)).length){Object.keys(FIELD_LABEL).forEach(k=>S.touched[k]=true);render();document.getElementById('errsum')?.focus();return}
    if(S.form.evidence.some(f=>!f.done)){toast('รอให้ไฟล์อัปโหลดเสร็จก่อนส่ง','alert');return}
    const r=persist('SUBMITTED');r.reporter=PEOPLE[S.role].name;r.submittedAt=new Date(NOW.getTime()+3600000);
    S.form=null;toast(`ส่งรายงาน ${a.no} รอบ ${pLabel(p)} ให้ผู้ดูแลระบบตรวจแล้ว`,'send');render()});
  const fileIn=document.getElementById('f-file'), drop=document.getElementById('drop');
  const addFiles=files=>{[...files].forEach(f=>{
    const ext=f.name.split('.').pop().toLowerCase();
    if(!['pdf','docx','xlsx','pptx','jpg','png'].includes(ext)){toast(`ไม่รองรับไฟล์ .${ext} ใช้ PDF, Word, Excel, PowerPoint, JPG หรือ PNG`,'alert');return}
    if(f.size>10*1024*1024){toast(`${f.name} ใหญ่เกิน 10 MB`,'alert');return}
    const item={kind:'FILE',name:f.name,size:f.size>1048576?`${(f.size/1048576).toFixed(1)} MB`:`${Math.max(1,Math.round(f.size/1024))} KB`,done:false};
    S.form.evidence.push(item);S.dirty=true;setTimeout(()=>{item.done=true;if(S.page==='report')render()},1200)});render()};
  fileIn.addEventListener('change',()=>addFiles(fileIn.files));
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files)});
}
function updateSubmit(a,p){const b=document.querySelector('#repForm [type=submit]');if(b)b.setAttribute('aria-disabled',Object.keys(validate(a,p,S.form)).length?'true':'false')}
function persist(state){
  const a=actById[S.rep.no],p=S.rep.p,v=S.form,k=key(a.no,p),prev=R[k]||{no:a.no,p,version:0};
  R[k]={...prev,actual:v.actual===''?'':+v.actual,progress:v.progress||'ON_PLAN',summary:v.summary,issues:v.issues,fix:v.fix,eta:v.eta,
    evidence:v.evidence.filter(f=>f.done).map(({done,...f})=>f),state,version:(prev.version||0)+1};
  return R[k];
}
function saveDraft(auto){
  if(S.page!=='report'||!S.form) return;
  const r=R[key(S.rep.no,S.rep.p)];
  persist(r?.state==='RETURNED'?'RETURNED':'DRAFT');S.dirty=false;S.lastSave=new Date();
  const n=document.getElementById('saveNote');if(n)n.textContent=`บันทึกร่างล่าสุด ${fmtT.format(S.lastSave)} น.`;
  toast(auto?`บันทึกร่างอัตโนมัติแล้ว · ${fmtT.format(S.lastSave)} น.`:'บันทึกร่างแล้ว','save');
}
setInterval(()=>{if(S.dirty)saveDraft(true)},30000);
function decide(act){
  const r=R[key(S.rep.no,S.rep.p)], c=document.getElementById('f-comment'), cm=c.value.trim(), who=PEOPLE.ADMIN.name, now=new Date(NOW.getTime()+3600000);
  if((act==='return'||act==='reopen')&&!cm){c.setAttribute('aria-invalid','true');c.setAttribute('aria-describedby','cmtErrMsg');
    document.getElementById('cmtErr').innerHTML=`<div class="ferr" id="cmtErrMsg">${ic('alert')}<span>${act==='return'?'ระบุเหตุผลที่ส่งกลับ เพื่อให้ผู้รายงานแก้ไขได้ถูกจุด':'ระบุเหตุผลที่เปิดให้แก้ไข'}</span></div>`;c.focus();return}
  if(act==='approve'){r.state='APPROVED';r.approver=who;r.approvedAt=now;if(cm)r.comment=cm;toast(`อนุมัติ ${r.no} รอบ ${pLabel(r.p)} แล้ว ผลถูกนับในตัวชี้วัด`,'shield')}
  if(act==='return'){r.state='RETURNED';r.approver=who;r.returnedAt=now;r.comment=cm;delete r.approvedAt;toast(`ส่ง ${r.no} กลับให้ผู้รายงานแก้ไขแล้ว`,'undo')}
  if(act==='reopen'){r.state='RETURNED';r.approver=who;r.returnedAt=now;r.comment=`เปิดให้แก้ไขโดยผู้ดูแลระบบ: ${cm}`;delete r.approvedAt;toast(`เปิดให้แก้ไข ${r.no} รอบ ${pLabel(r.p)} แล้ว (บันทึกใน audit log)`,'unlock')}
  r.version++;render();
}

/* ---------- boot ---------- */
const h=(location.hash||'').slice(1);
if(['dashboard','activities','dodont'].includes(h)) S.page=h;
else if(window.matchMedia('(max-width:480px)').matches) S.page='mytasks';
render();
</script>
